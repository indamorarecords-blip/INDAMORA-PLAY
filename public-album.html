<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Album — INDAMORA PLAY</title>
  <meta name="description" content="Découvrez cet album sur INDAMORA PLAY.">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --blue: #1689c7;
      --blue-dark: #0757b8;
      --blue-soft: #eaf6fc;
      --red: #d92525;
      --yellow: #f2c230;
      --green: #168447;
      --white: #ffffff;
      --cream: #fffdf8;
      --text: #18324a;
      --muted: #6d7f8f;
      --border: #e1edf3;
      --shadow: 0 18px 45px rgba(22, 89, 125, .10);
      --radius: 22px;
    }
    * {
      box-sizing: border-box;
    }
    html {
      scroll-behavior: smooth;
    }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, #eaf6fc 0, transparent 30%),
        linear-gradient(180deg, #ffffff 0%, var(--cream) 45%, #ffffff 100%);
      color: var(--text);
      line-height: 1.55;
    }
    a {
      color: inherit;
      text-decoration: none;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255,255,255,.96);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(14px);
    }
    .header-inner {
      max-width: 1180px;
      min-height: 72px;
      margin: auto;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .logo {
      color: var(--blue-dark);
      font-size: 21px;
      font-weight: 900;
      letter-spacing: .5px;
      white-space: nowrap;
    }
    .logo-play {
      color: var(--red);
    }
    .logo small {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1.5px;
    }
    .back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--white);
      color: var(--blue-dark);
      font-size: 13px;
      font-weight: 900;
      transition: .2s ease;
    }
    .back:hover {
      background: var(--blue-soft);
      border-color: var(--blue);
      transform: translateY(-1px);
    }
    main {
      max-width: 1180px;
      margin: auto;
      padding: 45px 20px 85px;
    }
    .album-card {
      position: relative;
      overflow: hidden;
      background: rgba(255,255,255,.96);
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: var(--shadow);
    }
    .album-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(
        90deg,
        var(--green) 0 25%,
        var(--yellow) 25% 50%,
        var(--red) 50% 75%,
        var(--blue) 75% 100%
      );
    }
    .album-header {
      display: grid;
      grid-template-columns: minmax(270px, 400px) 1fr;
      gap: 48px;
      align-items: center;
      padding: 42px;
    }
    .cover {
      width: 100%;
      aspect-ratio: 1 / 1;
      display: block;
      object-fit: cover;
      border-radius: 22px;
      background: var(--blue-soft);
      box-shadow: 0 22px 45px rgba(22,137,199,.18);
    }
    .cover-placeholder {
      width: 100%;
      aspect-ratio: 1 / 1;
      display: grid;
      place-items: center;
      border-radius: 22px;
      background:
        linear-gradient(145deg, var(--blue-soft), #ffffff);
      font-size: 80px;
      box-shadow: 0 22px 45px rgba(22,137,199,.10);
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 15px;
      padding: 7px 12px;
      border-radius: 999px;
      background: var(--blue-soft);
      color: var(--blue-dark);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 14px;
      color: var(--blue-dark);
      font-size: clamp(38px, 6vw, 66px);
      line-height: .98;
      letter-spacing: -2.5px;
    }
    .artist {
      margin-bottom: 20px;
      color: var(--muted);
      font-size: 16px;
    }
    .artist a {
      color: var(--blue);
      font-weight: 900;
      transition: color .2s ease;
    }
    .artist a:hover {
      color: var(--red);
    }
    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 17px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 7px 12px;
      border-radius: 999px;
      background: var(--blue-soft);
      color: var(--blue-dark);
      font-size: 11px;
      font-weight: 900;
    }
    .badge.red {
      background: rgba(217,37,37,.09);
      color: var(--red);
    }
    .badge.green {
      background: rgba(22,132,71,.10);
      color: var(--green);
    }
    .badge.yellow {
      background: rgba(242,194,48,.18);
      color: #806300;
    }
    .release {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 18px;
    }
    .description {
      max-width: 650px;
      color: #536b7d;
      font-size: 15px;
      line-height: 1.8;
    }
    .section {
      margin-top: 48px;
    }
    .section-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }
    .section-heading h2 {
      margin: 0;
      color: var(--blue-dark);
      font-size: 28px;
      line-height: 1.1;
    }
    .section-heading p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
    }
    .tracks {
      display: grid;
      gap: 11px;
    }
    .track {
      display: grid;
      grid-template-columns: 46px 1fr auto;
      align-items: center;
      gap: 15px;
      padding: 16px 18px;
      background: rgba(255,255,255,.97);
      border: 1px solid var(--border);
      border-radius: 17px;
      transition:
        border-color .2s ease,
        transform .2s ease,
        box-shadow .2s ease;
    }
    .track:hover {
      transform: translateY(-2px);
      border-color: rgba(22,137,199,.35);
      box-shadow: 0 10px 25px rgba(25,90,125,.08);
    }
    .track-number {
      width: 37px;
      height: 37px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      background: var(--blue-soft);
      color: var(--blue-dark);
      font-size: 13px;
      font-weight: 900;
    }
    .track-title {
      color: var(--text);
      font-size: 16px;
      font-weight: 800;
    }
    .plays {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    audio {
      width: 100%;
      grid-column: 2 / 4;
      height: 40px;
      accent-color: var(--blue);
    }
    .notice {
      padding: 18px;
      background: var(--blue-soft);
      border: 1px solid #cfe7f3;
      border-radius: 15px;
      color: #42657a;
      font-size: 14px;
    }
    .error {
      padding: 50px 25px;
      background: white;
      border: 1px solid #f0d1d1;
      border-radius: 20px;
      color: var(--red);
      text-align: center;
      box-shadow: var(--shadow);
    }
    .error a {
      display: inline-flex;
      margin-top: 16px;
      padding: 11px 17px;
      border-radius: 11px;
      background: var(--blue-dark);
      color: white;
      font-weight: 900;
    }
    .loading {
      padding: 95px 20px;
      color: var(--muted);
      text-align: center;
    }
    .loading-dot {
      width: 44px;
      height: 44px;
      margin: 0 auto 16px;
      border: 4px solid #dceef6;
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
    footer {
      padding: 42px 20px;
      background: white;
      border-top: 1px solid var(--border);
      color: var(--muted);
      text-align: center;
      font-size: 13px;
    }
    footer strong {
      color: var(--blue-dark);
      font-size: 17px;
    }
    .flag-line {
      width: 100px;
      height: 4px;
      margin: 15px auto;
      border-radius: 10px;
      background: linear-gradient(
        90deg,
        var(--green) 0 25%,
        var(--yellow) 25% 50%,
        var(--red) 50% 75%,
        var(--blue) 75% 100%
      );
    }
    @media (max-width: 800px) {
      .album-header {
        grid-template-columns: 1fr;
        padding: 27px;
        gap: 28px;
      }
      .cover,
      .cover-placeholder {
        max-width: 430px;
        margin: auto;
      }
      h1 {
        font-size: 43px;
      }
    }
    @media (max-width: 600px) {
      .header-inner {
        min-height: 62px;
        padding: 10px 15px;
      }
      .logo {
        font-size: 18px;
      }
      .logo small {
        font-size: 8px;
      }
      .back {
        padding: 8px 11px;
        font-size: 11px;
      }
      main {
        padding: 25px 15px 60px;
      }
      .album-card {
        border-radius: 21px;
      }
      .album-header {
        padding: 20px;
      }
      h1 {
        font-size: 36px;
        letter-spacing: -1px;
      }
      .description {
        font-size: 14px;
      }
      .track {
        grid-template-columns: 38px 1fr;
        gap: 11px;
        padding: 13px;
      }
      .track-number {
        width: 32px;
        height: 32px;
      }
      .track-title {
        font-size: 14px;
      }
      .plays {
        grid-column: 2;
        margin-top: -5px;
      }
      audio {
        grid-column: 1 / -1;
        margin-top: 4px;
      }
      .section-heading h2 {
        font-size: 23px;
      }
    }
  </style>
</head>
<body>
<header>
  <div class="header-inner">
    <a href="index.html" class="logo">
      🎧 INDAMORA
      <span class="logo-play">PLAY</span>
      <small>INDAMORA RECORDS</small>
    </a>
<a class="back" href="index.html">
  ← Accueil
</a>
  </div>
</header>
<main>
  <div id="loading" class="loading">
    <div class="loading-dot"></div>
    Chargement de l’album...
  </div>
  <div id="error" class="error" style="display:none;"></div>
  <section id="content" style="display:none;">
<div class="album-card">
  <div class="album-header">
    <div id="coverContainer"></div>
    <div>
      <span class="eyebrow">
        INDAMORA PLAY · ALBUM
      </span>
      <h1 id="albumTitle"></h1>
      <div class="artist">
        Par
        <a id="artistLink" href="#"></a>
      </div>
      <div id="badges" class="badges"></div>
      <div id="releaseDate" class="release"></div>
      <div id="description" class="description"></div>
    </div>
  </div>
</div>
<section class="section">
  <div class="section-heading">
    <div>
      <h2>🎵 Titres de l’album</h2>
      <p>
        Écoutez les morceaux disponibles sur INDAMORA PLAY.
      </p>
    </div>
  </div>
  <div id="tracks" class="tracks"></div>
</section>
  </section>
</main>
<footer>

INDAMORA PLAY

  <div class="flag-line"></div>
  <p>
    La voix de nos talents.
  </p>
  <p>
    INDAMORA RECORDS — Musique d’Afrique centrale 🇨🇫
  </p>
</footer>
<script>
  const SUPABASE_URL =
    "https://adqsdnqkbitplbhbihiv.supabase.co";
  const SUPABASE_KEY =
    "sb_publishable_dpjfWOYeNQRmP2nJq5FoMA_8NUuD0HF";
  const db =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );
  const params =
    new URLSearchParams(
      window.location.search
    );
  const albumId =
    params.get("id");
  const albumSlug =
    params.get("slug");
  const loading =
    document.getElementById(
      "loading"
    );
  const errorBox =
    document.getElementById(
      "error"
    );
  const content =
    document.getElementById(
      "content"
    );
  function showError(message) {
    loading.style.display = "none";
    content.style.display = "none";
    errorBox.innerHTML = `
      <strong>
        ${escapeHtml(message)}
      </strong>
      <br>
      <a href="index.html">
        ← Retour à INDAMORA PLAY
      </a>
    `;
    errorBox.style.display = "block";
  }
  function escapeHtml(value) {
    if (
      value === null ||
      value === undefined
    ) {
      return "";
    }
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }
  function formatDate(date) {
    if (!date) {
      return "";
    }
    try {
      return new Date(date)
        .toLocaleDateString(
          "fr-FR",
          {
            day: "numeric",
            month: "long",
            year: "numeric"
          }
        );
    } catch {
      return date;
    }
  }
  function createBadge(
    text,
    type = ""
  ) {
    if (!text) {
      return "";
    }
    return `
      <span class="badge ${type}">
        ${escapeHtml(text)}
      </span>
    `;
  }
  async function loadAlbum() {
    if (
      !albumId &&
      !albumSlug
    ) {
      showError(
        "Album introuvable."
      );
      return;
    }
    let query =
      db
        .from("albums")
        .select(`
          id,
          title,
          slug,
          type,
          cover_url,
          release_date,
          description,
          artist_id,
          artists (
            id,
            name,
            slug,
            city,
            region,
            language,
            genre,
            avatar_url,
            verified,
            status
          )
        `)
        .eq(
          "status",
          "published"
        )
        .limit(1);
    if (albumId) {
      query =
        query.eq(
          "id",
          albumId
        );
    } else {
      query =
        query.eq(
          "slug",
          albumSlug
        );
    }
    const {
      data: album,
      error
    } =
      await query.maybeSingle();
    if (error) {
      console.error(error);
      showError(
        "Impossible de charger cet album."
      );
      return;
    }
    if (!album) {
      showError(
        "Cet album n’est pas disponible."
      );
      return;
    }
    const artist =
      album.artists;
    if (
      !artist ||
      artist.status !== "published"
    ) {
      showError(
        "L’artiste associé à cet album n’est pas disponible."
      );
      return;
    }
    document.title =
      album.title +
      " — INDAMORA PLAY";
    document.getElementById(
      "albumTitle"
    ).textContent =
      album.title ||
      "Album";
    const artistLink =
      document.getElementById(
        "artistLink"
      );
    artistLink.textContent =
      artist.name ||
      "Artiste";
    artistLink.href =
      "public-artist.html?id=" +
      encodeURIComponent(
        artist.id
      );
    const coverContainer =
      document.getElementById(
        "coverContainer"
      );
    if (album.cover_url) {
      const img =
        document.createElement(
          "img"
        );
      img.className = "cover";
      img.src =
        album.cover_url;
      img.alt =
        "Pochette de " +
        album.title;
      img.loading = "eager";
      img.onerror =
        function() {
          this.style.display =
            "none";
          coverContainer.innerHTML =
            '<div class="cover-placeholder">💿</div>';
        };
      coverContainer.appendChild(
        img
      );
    } else {
      coverContainer.innerHTML =
        '<div class="cover-placeholder">💿</div>';
    }
    const badges =
      document.getElementById(
        "badges"
      );
    let badgesHtml = "";
    if (album.type) {
      badgesHtml +=
        createBadge(
          album.type.toUpperCase(),
          "red"
        );
    }
    if (artist.genre) {
      badgesHtml +=
        createBadge(
          artist.genre,
          "blue"
        );
    }
    if (artist.language) {
      badgesHtml +=
        createBadge(
          artist.language,
          "green"
        );
    }
    if (artist.verified) {
      badgesHtml +=
        createBadge(
          "✓ Artiste vérifié",
          "yellow"
        );
    }
    badges.innerHTML =
      badgesHtml;
    if (album.release_date) {
      document.getElementById(
        "releaseDate"
      ).innerHTML =
        "<strong>Sortie :</strong> " +
        formatDate(
          album.release_date
        );
    }
    document.getElementById(
      "description"
    ).textContent =
      album.description ||
      "Projet publié sur INDAMORA PLAY.";
    await loadTracks(
      album.id
    );
    loading.style.display =
      "none";
    content.style.display =
      "block";
  }
  async function loadTracks(
    albumId
  ) {
    const tracksContainer =
      document.getElementById(
        "tracks"
      );
    const {
      data: tracks,
      error
    } =
      await db
        .from("tracks")
        .select(`
          id,
          title,
          audio_url,
          duration_seconds,
          play_count,
          created_at,
          artist_id
        `)
        .eq(
          "album_id",
          albumId
        )
        .eq(
          "status",
          "published"
        )
        .order(
          "created_at",
          {
            ascending: true
          }
        );
    if (error) {
      console.error(error);
      tracksContainer.innerHTML = `
        <div class="notice">
          Impossible de charger les titres.
        </div>
      `;
      return;
    }
    if (
      !tracks ||
      tracks.length === 0
    ) {
      tracksContainer.innerHTML = `
        <div class="notice">
          Aucun titre publié dans cet album pour le moment.
        </div>
      `;
      return;
    }
    tracksContainer.innerHTML = "";
    tracks.forEach(
      (track, index) => {
        const box =
          document.createElement(
            "div"
          );
        box.className =
          "track";
        const number =
          document.createElement(
            "div"
          );
        number.className =
          "track-number";
        number.textContent =
          index + 1;
        const title =
          document.createElement(
            "div"
          );
        title.className =
          "track-title";
        title.textContent =
          track.title ||
          "Titre";
        const plays =
          document.createElement(
            "div"
          );
        plays.className =
          "plays";
        plays.textContent =
          Number(
            track.play_count || 0
          ) +
          " écoute(s)";
        box.appendChild(
          number
        );
        box.appendChild(
          title
        );
        box.appendChild(
          plays
        );
        if (track.audio_url) {
          const audio =
            document.createElement(
              "audio"
            );
          audio.controls =
            true;
          audio.preload =
            "none";
          audio.src =
            track.audio_url;
          box.appendChild(
            audio
          );
        } else {
          const notice =
            document.createElement(
              "div"
            );
          notice.className =
            "notice";
          notice.style.gridColumn =
            "1 / -1";
          notice.textContent =
            "🎵 Le fichier audio sera disponible après publication du fichier.";
          box.appendChild(
            notice
          );
        }
        tracksContainer.appendChild(
          box
        );
      }
    );
  }
  loadAlbum();
</script>
</body>
</html>
