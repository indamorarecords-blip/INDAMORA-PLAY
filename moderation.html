<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modération — INDAMORA PLAY</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f8ff;color:#102a43}
    header{background:#0757c9;color:#fff;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
    header h1{margin:0;font-size:21px}
    header span{font-size:13px;opacity:.9}
    .wrap{max-width:1200px;margin:auto;padding:22px 16px 50px}
    .card{background:#fff;border-radius:16px;padding:22px;margin-bottom:20px;box-shadow:0 5px 22px rgba(20,60,110,.08)}
    .login{max-width:430px;margin:70px auto}
    .brand{text-align:center;color:#0757c9;font-size:27px;font-weight:900;margin-bottom:7px}
    .muted{color:#607d9a;font-size:13px}
    label{display:block;font-weight:bold;font-size:14px;margin:13px 0 7px}
    input{width:100%;padding:12px;border:1px solid #c8d8eb;border-radius:10px}
    button{border:0;border-radius:9px;padding:10px 14px;font-weight:bold;cursor:pointer}
    .primary{background:#0757c9;color:#fff}
    .secondary{background:#e8f1ff;color:#0757c9}
    .danger{background:#ffe8e8;color:#b42318}
    .success{background:#e5f8ee;color:#16794c}
    .full{width:100%;margin-top:18px}
    .notice{padding:12px;border-radius:10px;background:#eef6ff;border-left:4px solid #0757c9;margin-bottom:18px;font-size:13px}
    .error,.ok{display:none;padding:12px;border-radius:9px;margin-top:14px;font-size:13px}
    .error{background:#ffe8e8;color:#a61b1b}
    .ok{background:#e5f8ee;color:#16794c}
    .row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:17px 0;border-bottom:1px solid #e5edf5}
    .row:last-child{border-bottom:0}
    .info h3{margin:0 0 7px;color:#0757c9}
    .meta{font-size:13px;color:#607d9a;line-height:1.6}
    .actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
    .status{display:inline-block;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:bold;background:#fff3d6;color:#956300}
    .hidden{display:none}
    .empty{text-align:center;padding:30px;color:#7890a6}

    @media(max-width:700px){
      .row{flex-direction:column}
      .actions{justify-content:flex-start}
      header{align-items:flex-start;flex-direction:column}
    }
  </style>
</head>

<body>

  <div id="loginScreen" class="wrap">
    <div class="card login">

      <div class="brand">INDAMORA PLAY</div>

      <div class="muted" style="text-align:center;margin-bottom:22px">
        Modération — INDAMORA RECORDS
      </div>

      <form id="loginForm">

        <label for="email">Adresse e-mail</label>
        <input
          id="email"
          type="email"
          autocomplete="email"
          required
        >

        <label for="password">Mot de passe</label>
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          required
        >

        <button
          id="loginBtn"
          class="primary full"
          type="submit"
        >
          Se connecter
        </button>

      </form>

      <div id="loginError" class="error"></div>

    </div>
  </div>


  <div id="app" class="hidden">

    <header>

      <div>
        <h1>INDAMORA PLAY — Modération</h1>
        <span id="identity">Administrateur</span>
      </div>

      <div style="display:flex;gap:8px;flex-wrap:wrap">

        <button
          class="secondary"
          onclick="loadPending()"
        >
          Actualiser
        </button>

        <button
          class="secondary"
          onclick="logout()"
        >
          Déconnexion
        </button>

      </div>

    </header>


    <main class="wrap">

      <div class="card">

        <div class="notice">
          Ici tu valides les artistes proposés.
          La publication d'un artiste publie automatiquement
          ses albums, musiques et médias actuellement en brouillon
          ou en attente.
        </div>

        <h2 style="margin-top:0;color:#0757c9">
          👤 Artistes à valider
        </h2>

        <div id="message" class="ok"></div>

        <div id="list">
          <div class="empty">Chargement...</div>
        </div>

      </div>

    </main>

  </div>


<script>

const SUPABASE_URL =
  "https://adqsdnqkbitplbhbihiv.supabase.co";

/*
  IMPORTANT :
  Remplace uniquement TA_CLE_PUBLISHABLE par
  ta clé publishable actuelle de Supabase.
*/
const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_dpjfWOYeNQRmP2nJq5FoMA_8NUuD0HF";

const supabase =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


const $ = id => document.getElementById(id);


function showError(target,text){
  target.textContent = text;
  target.style.display = "block";
}


function showOk(text){

  $("message").textContent = text;
  $("message").style.display = "block";

  setTimeout(() => {
    $("message").style.display = "none";
  },3500);

}


/* Vérification administrateur */

async function ensureAdmin(){

  const {
    data:{user}
  } = await supabase.auth.getUser();

  if(!user){
    return false;
  }


  const {
    data:profile,
    error
  } = await supabase
    .from("profiles")
    .select("display_name,role")
    .eq("id",user.id)
    .single();


  if(
    error ||
    !profile ||
    profile.role !== "admin"
  ){

    await supabase.auth.signOut();

    showError(
      $("loginError"),
      "Accès réservé à l’administrateur."
    );

    return false;
  }


  $("identity").textContent =
    `${profile.display_name || "Administrateur"} · admin`;


  $("loginScreen").classList.add("hidden");
  $("app").classList.remove("hidden");


  await loadPending();

  return true;
}


/* Connexion */

$("loginForm").addEventListener(
  "submit",
  async e => {

    e.preventDefault();

    $("loginError").style.display = "none";

    $("loginBtn").disabled = true;

    try{

      const {error} =
        await supabase.auth.signInWithPassword({

          email:
            $("email").value.trim(),

          password:
            $("password").value

        });


      if(error){
        throw error;
      }


      if(!(await ensureAdmin())){
        return;
      }

    }catch(err){

      showError(
        $("loginError"),
        err.message ||
        "Connexion impossible."
      );

    }finally{

      $("loginBtn").disabled = false;

    }

  }
);


/* Chargement des artistes en attente */

async function loadPending(){

  $("list").innerHTML =
    '<div class="empty">Chargement...</div>';


  const {
    data,
    error
  } = await supabase
    .from("artists")
    .select(`
      id,
      name,
      slug,
      bio,
      city,
      region,
      language,
      genre,
      avatar_url,
      status,
      created_at,
      owner_id
    `)
    .in(
      "status",
      ["pending","rejected"]
    )
    .order(
      "created_at",
      {ascending:false}
    );


  if(error){

    $("list").innerHTML =
      '<div class="empty">Erreur de chargement.</div>';

    console.error(error);

    return;
  }


  if(!data || !data.length){

    $("list").innerHTML =
      '<div class="empty">Aucune candidature à traiter.</div>';

    return;
  }


  $("list").innerHTML =
    data.map(a => {

      const date =
        a.created_at
          ? new Date(
              a.created_at
            ).toLocaleDateString("fr-FR")
          : "—";


      const status =
        a.status === "rejected"
          ? "Rejeté"
          : "En attente";


      return `

        <div class="row">

          <div class="info">

            <h3>
              ${esc(a.name || "Artiste sans nom")}
            </h3>

            <div>
              <span class="status">
                ${status}
              </span>
            </div>

            <div class="meta">

              Ville :
              ${esc(a.city || "—")}

              · Région :
              ${esc(a.region || "—")}

              <br>

              Langue :
              ${esc(a.language || "—")}

              · Genre :
              ${esc(a.genre || "—")}

              <br>

              Proposition :
              ${date}

              <br>

              ${
                a.bio
                  ? `Bio : ${esc(a.bio)}`
                  : ""
              }

            </div>

          </div>


          <div class="actions">

            <button
              class="success"
              onclick="publishArtist('${a.id}')"
            >
              ✓ Publier
            </button>

            <button
              class="danger"
              onclick="rejectArtist('${a.id}')"
            >
              ✕ Rejeter
            </button>

          </div>

        </div>

      `;

    }).join("");

}


/* Publication artiste + contenus */

async function publishArtist(id){

  if(
    !confirm(
      "Publier cet artiste et ses contenus en attente ?"
    )
  ){
    return;
  }


  try{

    /* Artiste */

    const {
      error:artistError
    } = await supabase
      .from("artists")
      .update({
        status:"published",
        updated_at:
          new Date().toISOString()
      })
      .eq("id",id);


    if(artistError){
      throw artistError;
    }


    /* Albums */

    const {
      error:albumError
    } = await supabase
      .from("albums")
      .update({
        status:"published"
      })
      .eq("artist_id",id)
      .in(
        "status",
        ["draft","pending"]
      );


    if(albumError){
      throw albumError;
    }


    /* Musiques */

    const {
      error:trackError
    } = await supabase
      .from("tracks")
      .update({
        status:"published",
        updated_at:
          new Date().toISOString()
      })
      .eq("artist_id",id)
      .in(
        "status",
        ["draft","pending"]
      );


    if(trackError){
      throw trackError;
    }


    /* Médias / clips / podcasts */

    const {
      error:mediaError
    } = await supabase
      .from("media")
      .update({
        status:"published"
      })
      .eq("artist_id",id)
      .in(
        "status",
        ["draft","pending"]
      );


    if(mediaError){
      throw mediaError;
    }


    showOk(
      "Artiste publié avec ses contenus en attente."
    );


    await loadPending();


  }catch(err){

    alert(
      "Publication impossible : " +
      (err.message || "erreur inconnue")
    );

  }

}


/* Rejet */

async function rejectArtist(id){

  if(
    !confirm(
      "Rejeter cette candidature ?"
    )
  ){
    return;
  }


  const {
    error
  } = await supabase
    .from("artists")
    .update({
      status:"rejected",
      updated_at:
        new Date().toISOString()
    })
    .eq("id",id);


  if(error){

    alert(
      "Rejet impossible : " +
      error.message
    );

    return;
  }


  showOk(
    "Candidature rejetée."
  );


  await loadPending();

}


/* Déconnexion */

async function logout(){

  await supabase.auth.signOut();

  location.reload();

}


/* Protection affichage HTML */

function esc(v){

  return String(v ?? "")
    .replace(
      /[&<>'"]/g,
      c => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        "'":"&#039;",
        '"':"&quot;"
      }[c])
    );

}


/* Restauration session */

supabase.auth.onAuthStateChange(
  (_event,_session) => {

    if(_session){
      ensureAdmin();
    }

  }
);


/* Démarrage */

ensureAdmin();

</script>

</body>
</html>
