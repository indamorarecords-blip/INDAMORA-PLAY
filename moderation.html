<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modération — INDAMORA PLAY</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f8ff;
      color: #10233f;
    }
    header {
      background: #0b5ed7;
      color: white;
      padding: 20px;
    }
    header .wrap {
      max-width: 1200px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }
    header h1 {
      margin: 0;
      font-size: 22px;
    }
    header p {
      margin: 5px 0 0;
      opacity: .9;
      font-size: 14px;
    }
    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: bold;
    }
    .logout {
      background: white;
      color: #0b5ed7;
    }
    main {
      max-width: 1200px;
      margin: 25px auto;
      padding: 0 15px 40px;
    }
    .card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 18px rgba(20, 60, 120, .08);
    }
    .login {
      max-width: 450px;
      margin: 60px auto;
    }
    h2 {
      margin-top: 0;
      color: #0b5ed7;
    }
    label {
      display: block;
      margin: 12px 0 6px;
      font-weight: bold;
    }
    input,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccd8ea;
      border-radius: 8px;
      font-size: 15px;
    }
    .primary {
      width: 100%;
      margin-top: 18px;
      background: #0b5ed7;
      color: white;
    }
    .primary:hover {
      background: #084db3;
    }
    .toolbar {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }
    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }
    .count {
      background: #e8f1ff;
      color: #0b5ed7;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
    }
    .item {
      border: 1px solid #dce6f5;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      background: #fbfdff;
    }
    .item-head {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      align-items: flex-start;
    }
    .item h3 {
      margin: 0 0 6px;
      color: #123b70;
    }
    .meta {
      color: #60738f;
      font-size: 13px;
      line-height: 1.6;
    }
    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      background: #fff4d6;
      color: #8a6200;
    }
    .status.rejected {
      background: #ffe5e5;
      color: #a40000;
    }
    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
    }
    .publish {
      background: #198754;
      color: white;
    }
    .reject {
      background: #dc3545;
      color: white;
    }
    .refresh {
      background: #e8f1ff;
      color: #0b5ed7;
    }
    .empty {
      text-align: center;
      padding: 30px;
      color: #6d7d93;
    }
    .error {
      background: #ffe8e8;
      color: #9d0000;
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
      display: none;
      white-space: pre-wrap;
    }
    .success {
      background: #e5f8ed;
      color: #116b3b;
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
      display: none;
    }
    .hidden {
      display: none !important;
    }
    @media (max-width: 700px) {
      .toolbar {
        grid-template-columns: 1fr;
      }
      .item-head {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <header id="appHeader" class="hidden">
    <div class="wrap">
      <div>
        <h1>INDAMORA PLAY — Modération</h1>
        <p>Administration sécurisée des contenus</p>
      </div>
  <button class="logout" id="logoutBtn">
    Déconnexion
  </button>
</div>
  </header>
  <main>
<!-- CONNEXION -->
<section id="loginSection" class="card login">
  <h2>Connexion administrateur</h2>
  <label for="email">Email</label>
  <input
    id="email"
    type="email"
    autocomplete="username"
    placeholder="Votre email"
  >
  <label for="password">Mot de passe</label>
  <input
    id="password"
    type="password"
    autocomplete="current-password"
    placeholder="Votre mot de passe"
  >
  <button class="primary" id="loginBtn">
    Se connecter
  </button>
  <div id="loginError" class="error"></div>
</section>
<!-- APPLICATION -->
<section id="appSection" class="hidden">
  <div class="card">
    <div class="section-title">
      <div>
        <h2>Centre de modération</h2>
        <div class="meta">
          Seuls les administrateurs peuvent publier ou refuser les contenus.
        </div>
      </div>
      <button class="refresh" id="refreshBtn">
        Actualiser
      </button>
    </div>
    <div class="toolbar">
      <input
        id="searchInput"
        type="search"
        placeholder="Rechercher un artiste, une musique, un album..."
      >
      <select id="filterType">
        <option value="all">Tous les contenus</option>
        <option value="artists">Artistes</option>
        <option value="tracks">Musiques</option>
        <option value="albums">Albums</option>
        <option value="media">Médias</option>
      </select>
    </div>
    <div id="globalError" class="error"></div>
    <div id="globalSuccess" class="success"></div>
  </div>
  <!-- ARTISTES -->
  <div class="card" id="artistsCard">
    <div class="section-title">
      <h2>Artistes à modérer</h2>
      <span class="count" id="artistsCount">0</span>
    </div>
    <div id="artistsList"></div>
  </div>
  <!-- MUSIQUES -->
  <div class="card" id="tracksCard">
    <div class="section-title">
      <h2>Musiques à modérer</h2>
      <span class="count" id="tracksCount">0</span>
    </div>
    <div id="tracksList"></div>
  </div>
  <!-- ALBUMS -->
  <div class="card" id="albumsCard">
    <div class="section-title">
      <h2>Albums à modérer</h2>
      <span class="count" id="albumsCount">0</span>
    </div>
    <div id="albumsList"></div>
  </div>
  <!-- MEDIAS -->
  <div class="card" id="mediaCard">
    <div class="section-title">
      <h2>Clips / podcasts / médias</h2>
      <span class="count" id="mediaCount">0</span>
    </div>
    <div id="mediaList"></div>
  </div>
</section>
  </main>
<script>
  /*
   * ============================================================
   * INDAMORA PLAY — MODERATION
   * ============================================================
   *
   * IMPORTANT :
   * Remplace uniquement TA_CLE_PUBLISHABLE par ta clé
   * publishable actuelle de Supabase.
   *
   * NE METS JAMAIS la service_role key ici.
   * ============================================================
   */
  const SUPABASE_URL =
    "https://adqsdnqkbitplbhbihiv.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_dpjfWOYeNQRmP2nJq5FoMA_8NUuD0HF";
  const { createClient } = supabase;
  const client = createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );
  const loginSection = document.getElementById("loginSection");
  const appSection = document.getElementById("appSection");
  const appHeader = document.getElementById("appHeader");
  const loginBtn = document.getElementById("loginBtn");
  const logoutBtn = document.getElementById("logoutBtn");
  const refreshBtn = document.getElementById("refreshBtn");
  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");
  const loginError = document.getElementById("loginError");
  const globalError = document.getElementById("globalError");
  const globalSuccess = document.getElementById("globalSuccess");
  const searchInput = document.getElementById("searchInput");
  const filterType = document.getElementById("filterType");
  let data = {
    artists: [],
    tracks: [],
    albums: [],
    media: []
  };
  function showError(element, message) {
    element.textContent = message || "Une erreur est survenue.";
    element.style.display = "block";
  }
  function hideError(element) {
    element.style.display = "none";
    element.textContent = "";
  }
  function showSuccess(message) {
    globalSuccess.textContent = message;
    globalSuccess.style.display = "block";
    setTimeout(() => {
      globalSuccess.style.display = "none";
    }, 3500);
  }
  function escapeHtml(value) {
    if (value === null || value === undefined) {
      return "";
    }
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }
  function normalize(value) {
    return String(value || "")
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "");
  }
  function matchesSearch(item, fields) {
    const search = normalize(searchInput.value.trim());
    if (!search) {
      return true;
    }
    return fields.some(field =>
      normalize(item[field]).includes(search)
    );
  }
  async function checkAdmin() {
    const {
      data: sessionData
    } = await client.auth.getSession();
    if (!sessionData.session) {
      showLogin();
      return false;
    }
    const userId = sessionData.session.user.id;
    const {
      data: profile,
      error
    } = await client
      .from("profiles")
      .select("id, display_name, role")
      .eq("id", userId)
      .maybeSingle();
    if (error) {
      showLogin();
      showError(
        loginError,
        "Impossible de vérifier votre profil administrateur."
      );
      return false;
    }
    if (!profile || profile.role !== "admin") {
      await client.auth.signOut();
      showLogin();
      showError(
        loginError,
        "Accès refusé : ce compte n'est pas administrateur."
      );
      return false;
    }
    showApp();
    return true;
  }
  function showLogin() {
    loginSection.classList.remove("hidden");
    appSection.classList.add("hidden");
    appHeader.classList.add("hidden");
    emailInput.focus();
  }
  function showApp() {
    loginSection.classList.add("hidden");
    appSection.classList.remove("hidden");
    appHeader.classList.remove("hidden");
  }
  async function login() {
    hideError(loginError);
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    if (!email || !password) {
      showError(
        loginError,
        "Veuillez saisir votre email et votre mot de passe."
      );
      return;
    }
    loginBtn.disabled = true;
    loginBtn.textContent = "Connexion...";
    const {
      error
    } = await client.auth.signInWithPassword({
      email,
      password
    });
    loginBtn.disabled = false;
    loginBtn.textContent = "Se connecter";
    if (error) {
      showError(
        loginError,
        "Connexion impossible : " + error.message
      );
      return;
    }
    const isAdmin = await checkAdmin();
    if (isAdmin) {
      await loadAll();
    }
  }
  async function logout() {
    await client.auth.signOut();
    data = {
      artists: [],
      tracks: [],
      albums: [],
      media: []
    };
    showLogin();
    emailInput.value = "";
    passwordInput.value = "";
    hideError(loginError);
  }
  async function loadAll() {
    hideError(globalError);
    try {
      const [
        artistsResult,
        tracksResult,
        albumsResult,
        mediaResult
      ] = await Promise.all([
        client
          .from("artists")
          .select(`
            id,
            owner_id,
            name,
            slug,
            bio,
            city,
            region,
            language,
            genre,
            avatar_url,
            verified,
            status,
            created_at
          `)
          .in("status", ["pending", "rejected"])
          .order("created_at", { ascending: false }),
        client
          .from("tracks")
          .select(`
            id,
            artist_id,
            album_id,
            title,
            slug,
            genre,
            language,
            city,
            region,
            status,
            play_count,
            created_at,
            artists (
              id,
              name
            )
          `)
          .in("status", ["pending", "rejected"])
          .order("created_at", { ascending: false }),
        client
          .from("albums")
          .select(`
            id,
            artist_id,
            title,
            slug,
            type,
            cover_url,
            release_date,
            description,
            status,
            created_at,
            artists (
              id,
              name
            )
          `)
          .in("status", ["pending", "rejected"])
          .order("created_at", { ascending: false }),
        client
          .from("media")
          .select(`
            id,
            artist_id,
            title,
            type,
            media_url,
            description,
            status,
            created_at,
            artists (
              id,
              name
            )
          `)
          .in("status", ["pending", "rejected"])
          .order("created_at", { ascending: false })
      ]);
      if (artistsResult.error) {
        throw artistsResult.error;
      }
      if (tracksResult.error) {
        throw tracksResult.error;
      }
      if (albumsResult.error) {
        throw albumsResult.error;
      }
      if (mediaResult.error) {
        throw mediaResult.error;
      }
      data.artists = artistsResult.data || [];
      data.tracks = tracksResult.data || [];
      data.albums = albumsResult.data || [];
      data.media = mediaResult.data || [];
      renderAll();
    } catch (error) {
      showError(
        globalError,
        "Erreur de chargement : " +
        (error.message || error)
      );
    }
  }
  function renderAll() {
    const type = filterType.value;
    document.getElementById("artistsCard")
      .classList.toggle(
        "hidden",
        type !== "all" && type !== "artists"
      );
    document.getElementById("tracksCard")
      .classList.toggle(
        "hidden",
        type !== "all" && type !== "tracks"
      );
    document.getElementById("albumsCard")
      .classList.toggle(
        "hidden",
        type !== "all" && type !== "albums"
      );
    document.getElementById("mediaCard")
      .classList.toggle(
        "hidden",
        type !== "all" && type !== "media"
      );
    renderArtists();
    renderTracks();
    renderAlbums();
    renderMedia();
  }
  function renderArtists() {
    const list = document.getElementById("artistsList");
    const rows = data.artists.filter(item =>
      matchesSearch(item, [
        "name",
        "city",
        "region",
        "language",
        "genre"
      ])
    );
    document.getElementById("artistsCount").textContent =
      rows.length;
    if (!rows.length) {
      list.innerHTML =
        '<div class="empty">Aucun artiste à afficher.</div>';
      return;
    }
    list.innerHTML = rows.map(artist => `
      <div class="item">
        <div class="item-head">
          <div>
            <h3>${escapeHtml(artist.name)}</h3>
            <div class="meta">
              Ville :
              ${escapeHtml(artist.city || "Non renseignée")}
              <br>
              Région :
              ${escapeHtml(artist.region || "Non renseignée")}
              <br>
              Langue :
              ${escapeHtml(artist.language || "Non renseignée")}
              <br>
              Genre :
              ${escapeHtml(artist.genre || "Non renseigné")}
            </div>
          </div>
          <span class="status ${artist.status === "rejected" ? "rejected" : ""}">
            ${escapeHtml(artist.status)}
          </span>
        </div>
        <div class="actions">
          <button
            class="publish"
            onclick="publishArtist('${artist.id}')"
          >
            Publier
          </button>
          <button
            class="reject"
            onclick="rejectArtist('${artist.id}')"
          >
            Refuser
          </button>
        </div>
      </div>
    `).join("");
  }
  function renderTracks() {
    const list = document.getElementById("tracksList");
    const rows = data.tracks.filter(item =>
      matchesSearch(item, [
        "title",
        "genre",
        "language",
        "city",
        "region"
      ])
    );
    document.getElementById("tracksCount").textContent =
      rows.length;
    if (!rows.length) {
      list.innerHTML =
        '<div class="empty">Aucune musique à afficher.</div>';
      return;
    }
    list.innerHTML = rows.map(track => `
      <div class="item">
        <div class="item-head">
          <div>
            <h3>${escapeHtml(track.title)}</h3>
            <div class="meta">
              Artiste :
              ${escapeHtml(track.artists?.name || "Inconnu")}
              <br>
              Genre :
              ${escapeHtml(track.genre || "Non renseigné")}
              <br>
              Langue :
              ${escapeHtml(track.language || "Non renseignée")}
              <br>
              Écoutes :
              ${Number(track.play_count || 0)}
            </div>
          </div>
          <span class="status ${track.status === "rejected" ? "rejected" : ""}">
            ${escapeHtml(track.status)}
          </span>
        </div>
        <div class="actions">
          <button
            class="publish"
            onclick="publishContent('tracks', '${track.id}')"
          >
            Publier
          </button>
          <button
            class="reject"
            onclick="rejectContent('tracks', '${track.id}')"
          >
            Refuser
          </button>
        </div>
      </div>
    `).join("");
  }
  function renderAlbums() {
    const list = document.getElementById("albumsList");
    const rows = data.albums.filter(item =>
      matchesSearch(item, [
        "title",
        "type",
        "description"
      ])
    );
    document.getElementById("albumsCount").textContent =
      rows.length;
    if (!rows.length) {
      list.innerHTML =
        '<div class="empty">Aucun album à afficher.</div>';
      return;
    }
    list.innerHTML = rows.map(album => `
      <div class="item">
        <div class="item-head">
          <div>
            <h3>${escapeHtml(album.title)}</h3>
            <div class="meta">
              Artiste :
              ${escapeHtml(album.artists?.name || "Inconnu")}
              <br>
              Type :
              ${escapeHtml(album.type || "Non renseigné")}
              <br>
              Date :
              ${escapeHtml(album.release_date || "Non renseignée")}
            </div>
          </div>
          <span class="status ${album.status === "rejected" ? "rejected" : ""}">
            ${escapeHtml(album.status)}
          </span>
        </div>
        <div class="actions">
          <button
            class="publish"
            onclick="publishContent('albums', '${album.id}')"
          >
            Publier
          </button>
          <button
            class="reject"
            onclick="rejectContent('albums', '${album.id}')"
          >
            Refuser
          </button>
        </div>
      </div>
    `).join("");
  }
  function renderMedia() {
    const list = document.getElementById("mediaList");
    const rows = data.media.filter(item =>
      matchesSearch(item, [
        "title",
        "type",
        "description"
      ])
    );
    document.getElementById("mediaCount").textContent =
      rows.length;
    if (!rows.length) {
      list.innerHTML =
        '<div class="empty">Aucun média à afficher.</div>';
      return;
    }
    list.innerHTML = rows.map(media => `
      <div class="item">
        <div class="item-head">
          <div>
            <h3>${escapeHtml(media.title)}</h3>
            <div class="meta">
              Artiste :
              ${escapeHtml(media.artists?.name || "Inconnu")}
              <br>
              Type :
              ${escapeHtml(media.type || "Non renseigné")}
            </div>
          </div>
          <span class="status ${media.status === "rejected" ? "rejected" : ""}">
            ${escapeHtml(media.status)}
          </span>
        </div>
        <div class="actions">
          <button
            class="publish"
            onclick="publishContent('media', '${media.id}')"
          >
            Publier
          </button>
          <button
            class="reject"
            onclick="rejectContent('media', '${media.id}')"
          >
            Refuser
          </button>
        </div>
      </div>
    `).join("");
  }
  /*
   * ============================================================
   * MODERATION SECURISEE
   * ============================================================
   *
   * Aucun UPDATE direct du statut n'est effectué ici.
   *
   * Les changements passent par les fonctions SQL sécurisées :
   *
   * admin_publish_artist()
   * admin_reject_artist()
   * admin_publish_content()
   * admin_reject_content()
   *
   * Le serveur vérifie lui-même que l'utilisateur est admin.
   * ============================================================
   */
  async function publishArtist(id) {
    if (!confirm(
      "Publier cet artiste ?\n\n" +
      "Ses albums, musiques et médias en attente seront également publiés."
    )) {
      return;
    }
    hideError(globalError);
    const {
      data: result,
      error
    } = await client.rpc(
      "admin_publish_artist",
      {
        p_artist_id: id
      }
    );
    if (error) {
      showError(
        globalError,
        "Publication refusée : " +
        error.message
      );
      return;
    }
    if (!result?.success) {
      showError(
        globalError,
        "La publication n'a pas été confirmée par le serveur."
      );
      return;
    }
    showSuccess(
      "Artiste publié avec succès."
    );
    await loadAll();
  }
  async function rejectArtist(id) {
    if (!confirm(
      "Refuser cet artiste ?"
    )) {
      return;
    }
    hideError(globalError);
    const {
      data: result,
      error
    } = await client.rpc(
      "admin_reject_artist",
      {
        p_artist_id: id
      }
    );
    if (error) {
      showError(
        globalError,
        "Refus impossible : " +
        error.message
      );
      return;
    }
    if (!result?.success) {
      showError(
        globalError,
        "Le serveur n'a pas confirmé le refus."
      );
      return;
    }
    showSuccess(
      "Artiste refusé."
    );
    await loadAll();
  }
  async function publishContent(table, id) {
    const labels = {
      tracks: "cette musique",
      albums: "cet album",
      media: "ce média"
    };
    if (!labels[table]) {
      showError(
        globalError,
        "Type de contenu invalide."
      );
      return;
    }
    if (!confirm(
      "Publier " + labels[table] + " ?"
    )) {
      return;
    }
    hideError(globalError);
    const {
      data: result,
      error
    } = await client.rpc(
      "admin_publish_content",
      {
        p_table: table,
        p_id: id
      }
    );
    if (error) {
      showError(
        globalError,
        "Publication refusée : " +
        error.message
      );
      return;
    }
    if (!result?.success) {
      showError(
        globalError,
        "Le serveur n'a pas confirmé la publication."
      );
      return;
    }
    showSuccess(
      "Contenu publié avec succès."
    );
    await loadAll();
  }
  async function rejectContent(table, id) {
    const labels = {
      tracks: "cette musique",
      albums: "cet album",
      media: "ce média"
    };
    if (!labels[table]) {
      showError(
        globalError,
        "Type de contenu invalide."
      );
      return;
    }
    if (!confirm(
      "Refuser " + labels[table] + " ?"
    )) {
      return;
    }
    hideError(globalError);
    const {
      data: result,
      error
    } = await client.rpc(
      "admin_reject_content",
      {
        p_table: table,
        p_id: id
      }
    );
    if (error) {
      showError(
        globalError,
        "Refus impossible : " +
        error.message
      );
      return;
    }
    if (!result?.success) {
      showError(
        globalError,
        "Le serveur n'a pas confirmé le refus."
      );
      return;
    }
    showSuccess(
      "Contenu refusé."
    );
    await loadAll();
  }
  loginBtn.addEventListener(
    "click",
    login
  );
  logoutBtn.addEventListener(
    "click",
    logout
  );
  refreshBtn.addEventListener(
    "click",
    loadAll
  );
  searchInput.addEventListener(
    "input",
    renderAll
  );
  filterType.addEventListener(
    "change",
    renderAll
  );
  passwordInput.addEventListener(
    "keydown",
    event => {
      if (event.key === "Enter") {
        login();
      }
    }
  );
  /*
   * Restauration automatique de session.
   */
  (async function init() {
    const isAdmin = await checkAdmin();
    if (isAdmin) {
      await loadAll();
    }
  })();
  /*
   * Réagit aux changements de session Supabase.
   */
  client.auth.onAuthStateChange(
    async (event, session) => {
      if (event === "SIGNED_OUT" || !session) {
        showLogin();
        return;
      }
      if (event === "SIGNED_IN") {
        const isAdmin = await checkAdmin();
        if (isAdmin) {
          await loadAll();
        }
      }
    }
  );
</script>
</body>
