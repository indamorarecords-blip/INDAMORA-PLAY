<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INDAMORA PLAY — Mon compte</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f9ff;
      color: #123;
    }
    header {
      background: #0757b8;
      color: white;
      padding: 20px;
      text-align: center;
    }
    header h1 {
      margin: 0;
    }
    header p {
      margin: 6px 0 0;
    }
    .container {
      max-width: 520px;
      margin: 35px auto;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
    }
    h2 {
      color: #0757b8;
      text-align: center;
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 13px;
      margin-top: 7px;
      border: 1px solid #ccd8e8;
      border-radius: 9px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 13px;
      margin-top: 18px;
      border: 0;
      border-radius: 9px;
      background: #0757b8;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #064b9e;
    }
    .secondary {
      background: #e8f1ff;
      color: #0757b8;
    }
    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 9px;
      display: none;
      line-height: 1.5;
    }
    .success {
      background: #eaf8ee;
      color: #176b2c;
    }
    .error {
      background: #ffecec;
      color: #a40000;
    }
    .account-box {
      text-align: center;
      display: none;
    }
    .account-box strong {
      color: #0757b8;
    }
    a {
      color: #0757b8;
      text-decoration: none;
      font-weight: bold;
    }
    .back {
      display: block;
      text-align: center;
      margin-top: 22px;
    }
  </style>
</head>
<body>
<header>
  <h1>🎧 INDAMORA PLAY</h1>
  <p>INDAMORA RECORDS</p>
</header>
<div class="container">
  <div class="card">
    <div id="authBox">
      <h2>Créer mon compte</h2>
      <label for="email">Adresse e-mail</label>
      <input
        id="email"
        type="email"
        placeholder="votre@email.com"
        autocomplete="email"
      >
      <label for="password">Mot de passe</label>
      <input
        id="password"
        type="password"
        placeholder="Minimum 6 caractères"
        autocomplete="new-password"
      >
      <button id="signupBtn">
        Créer mon compte
      </button>
      <button id="loginBtn" class="secondary">
        Se connecter
      </button>
      <div id="message" class="message"></div>
    </div>
    <div id="accountBox" class="account-box">
      <h2>Mon espace</h2>
      <p>
        Vous êtes connecté avec :
      </p>
      <p>
        <strong id="userEmail"></strong>
      </p>
      <button id="subscriptionBtn">
        💳 Voir les abonnements et dons
      </button>
      <button id="logoutBtn" class="secondary">
        Déconnexion
      </button>
      <div id="accountMessage" class="message"></div>
    </div>
  </div>
  <a class="back" href="index.html">
    ← Retour à INDAMORA PLAY
  </a>
</div>
<script>
  const SUPABASE_URL =
    "https://adqsdnqkbitplbhbihiv.supabase.co";
  const SUPABASE_KEY =
    "sb_publishable_dpjfWOYeNQRmP2nJq5FoMA_8NUuD0HF";
  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );
  const authBox =
    document.getElementById("authBox");
  const accountBox =
    document.getElementById("accountBox");
  const emailInput =
    document.getElementById("email");
  const passwordInput =
    document.getElementById("password");
  const signupBtn =
    document.getElementById("signupBtn");
  const loginBtn =
    document.getElementById("loginBtn");
  const logoutBtn =
    document.getElementById("logoutBtn");
  const subscriptionBtn =
    document.getElementById("subscriptionBtn");
  const message =
    document.getElementById("message");
  const accountMessage =
    document.getElementById("accountMessage");
  const userEmail =
    document.getElementById("userEmail");
  function showMessage(element, text, type) {
    element.textContent = text;
    element.className = "message " + type;
    element.style.display = "block";
  }
  function hideMessage(element) {
    element.style.display = "none";
  }
  function showAccount(email) {
    authBox.style.display = "none";
    accountBox.style.display = "block";
    userEmail.textContent = email || "Utilisateur";
  }
  function showAuth() {
    authBox.style.display = "block";
    accountBox.style.display = "none";
  }
  async function checkSession() {
    const {
      data,
      error
    } = await db.auth.getSession();
    if (error) {
      showAuth();
      showMessage(
        message,
        error.message,
        "error"
      );
      return;
    }
    const session = data.session;
    if (session && session.user) {
      showAccount(session.user.email);
    } else {
      showAuth();
    }
  }
  signupBtn.addEventListener(
    "click",
    async () => {
      hideMessage(message);
      const email =
        emailInput.value.trim();
      const password =
        passwordInput.value;
      if (!email) {
        showMessage(
          message,
          "Veuillez saisir votre adresse e-mail.",
          "error"
        );
        return;
      }
      if (password.length < 6) {
        showMessage(
          message,
          "Le mot de passe doit contenir au moins 6 caractères.",
          "error"
        );
        return;
      }
      signupBtn.disabled = true;
      signupBtn.textContent =
        "Création du compte...";
      const {
        data,
        error
      } = await db.auth.signUp({
        email: email,
        password: password
      });
      signupBtn.disabled = false;
      signupBtn.textContent =
        "Créer mon compte";
      if (error) {
        showMessage(
          message,
          error.message,
          "error"
        );
        return;
      }
      if (data.session) {
        showAccount(
          data.session.user.email
        );
        showMessage(
          accountMessage,
          "Votre compte est créé. Vous pouvez maintenant accéder aux abonnements.",
          "success"
        );
      } else {
        showMessage(
          message,
          "Votre compte a été créé. Consultez votre e-mail pour confirmer votre adresse, puis revenez vous connecter.",
          "success"
        );
      }
    }
  );
  loginBtn.addEventListener(
    "click",
    async () => {
      hideMessage(message);
      const email =
        emailInput.value.trim();
      const password =
        passwordInput.value;
      if (!email || !password) {
        showMessage(
          message,
          "Veuillez saisir votre e-mail et votre mot de passe.",
          "error"
        );
        return;
      }
      loginBtn.disabled = true;
      loginBtn.textContent =
        "Connexion...";
      const {
        data,
        error
      } = await db.auth.signInWithPassword({
        email: email,
        password: password
      });
      loginBtn.disabled = false;
      loginBtn.textContent =
        "Se connecter";
      if (error) {
        showMessage(
          message,
          error.message,
          "error"
        );
        return;
      }
      if (data.session) {
        showAccount(
          data.session.user.email
        );
        showMessage(
          accountMessage,
          "Connexion réussie.",
          "success"
        );
      }
    }
  );
  logoutBtn.addEventListener(
    "click",
    async () => {
      await db.auth.signOut();
      emailInput.value = "";
      passwordInput.value = "";
      showAuth();
      showMessage(
        message,
        "Vous êtes maintenant déconnecté.",
        "success"
      );
    }
  );
  subscriptionBtn.addEventListener(
    "click",
    async () => {
      const {
        data
      } = await db.auth.getSession();
      if (!data.session) {
        showAuth();
        return;
      }
      window.location.href =
        "subscription-account.html";
    }
  );
  db.auth.onAuthStateChange(
    (event, session) => {
      if (session && session.user) {
        showAccount(
          session.user.email
        );
      } else {
        showAuth();
      }
    }
  );
  checkSession();
</script>
</body>
</html>
