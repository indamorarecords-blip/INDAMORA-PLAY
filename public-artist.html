<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artiste — INDAMORA PLAY</title>
  <meta
    name="description"
    content="Découvrez les artistes, musiques, albums et créations sur INDAMORA PLAY."
  >
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --blue: #1689c7;
      --blue-dark: #0757b8;
      --blue-soft: #eaf6fc;
      --red: #d92525;
      --yellow: #f2c230;
      --green: #168447;
      --white: #ffffff;
      --cream: #fffdf8;
      --text: #18324a;
      --muted: #6d7f8f;
      --border: #e2edf3;
      --shadow: 0 10px 30px rgba(25, 90, 125, .09);
      --radius: 18px;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html {
      scroll-behavior: smooth;
    }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--cream);
      color: var(--text);
      line-height: 1.55;
    }
    a {
      color: inherit;
      text-decoration: none;
    }
    button {
      font: inherit;
    }
    /* =========================
       HEADER
    ========================= */
    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255, 255, 255, .96);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
    }
    .header-inner {
      max-width: 1180px;
      min-height: 70px;
      margin: auto;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .logo {
      color: var(--blue-dark);
      font-size: 21px;
      font-weight: 900;
      letter-spacing: .4px;
      white-space: nowrap;
    }
    .logo-play {
      color: var(--red);
    }
    .logo small {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 10px 15px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--blue-dark);
      font-size: 13px;
      font-weight: 800;
      background: white;
    }
    .back-link:hover {
      border-color: var(--blue);
      background: var(--blue-soft);
    }
    /* =========================
       HERO
    ========================= */
    .hero {
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(
          circle at 85% 15%,
          rgba(242, 194, 48, .35),
          transparent 28%
        ),
        radial-gradient(
          circle at 10% 90%,
          rgba(22, 132, 71, .18),
          transparent 30%
        ),
        linear-gradient(
          135deg,
          #1689c7 0%,
          #0874b8 55%,
          #0757b8 100%
        );
      color: white;
    }
    .hero::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 5px;
      background:
        linear-gradient(
          90deg,
          var(--green) 0 25%,
          var(--yellow) 25% 50%,
          var(--red) 50% 75%,
          var(--blue) 75% 100%
        );
    }
    .hero-inner {
      position: relative;
      z-index: 1;
      max-width: 1180px;
      margin: auto;
      padding: 65px 20px 70px;
      display: flex;
      align-items: center;
      gap: 35px;
    }
    .avatar-wrap {
      flex: 0 0 auto;
      position: relative;
    }
    .avatar {
      width: 190px;
      height: 190px;
      display: block;
      border-radius: 50%;
      object-fit: cover;
      background: white;
      border: 6px solid white;
      box-shadow: 0 15px 40px rgba(0, 0, 0, .16);
    }
    .avatar-badge {
      position: absolute;
      right: 8px;
      bottom: 12px;
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--yellow);
      color: var(--text);
      border: 4px solid white;
      font-weight: 900;
    }
    .hero-content {
      max-width: 760px;
    }
    .eyebrow {
      display: inline-block;
      margin-bottom: 10px;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #fff3b8;
    }
    .hero h1 {
      font-size: clamp(38px, 7vw, 68px);
      line-height: .98;
      letter-spacing: -2px;
      margin-bottom: 15px;
    }
    .hero-bio {
      max-width: 700px;
      color: rgba(255,255,255,.91);
      font-size: 16px;
    }
    .hero-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 20px;
    }
    .meta-pill {
      padding: 7px 11px;
      border-radius: 999px;
      background: rgba(255,255,255,.14);
      border: 1px solid rgba(255,255,255,.22);
      font-size: 12px;
      font-weight: 700;
    }
    .verified {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 16px;
      padding: 7px 12px;
      border-radius: 999px;
      background: white;
      color: var(--blue-dark);
      font-size: 12px;
      font-weight: 900;
    }
    /* =========================
       MAIN
    ========================= */
    main {
      max-width: 1180px;
      margin: auto;
      padding: 45px 20px 85px;
    }
    section {
      margin-bottom: 50px;
    }
    .section-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
    }
    .section-heading h2 {
      color: var(--blue-dark);
      font-size: 27px;
      line-height: 1.1;
    }
    .section-heading p {
      color: var(--muted);
      font-size: 13px;
    }
    /* =========================
       CARDS
    ========================= */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }
    .card {
      overflow: hidden;
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      transition:
        transform .2s ease,
        box-shadow .2s ease,
        border-color .2s ease;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: rgba(22, 137, 199, .35);
      box-shadow: 0 15px 35px rgba(25, 90, 125, .12);
    }
    .card-body {
      padding: 18px;
    }
    .card h3 {
      color: var(--blue-dark);
      font-size: 18px;
      margin-bottom: 7px;
    }
    .meta {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }
    /* =========================
       MUSIC
    ========================= */
    .track-card {
      padding: 18px;
    }
    .track-top {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 12px;
    }
    .track-number {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: var(--blue-soft);
      color: var(--blue-dark);
      font-size: 14px;
      font-weight: 900;
    }
    audio {
      width: 100%;
      height: 42px;
      margin-top: 8px;
    }
    .play-count {
      display: inline-block;
      margin-top: 10px;
      color: var(--green);
      font-size: 12px;
      font-weight: 800;
    }
    /* =========================
       ALBUMS
    ========================= */
    .cover {
      width: 100%;
      aspect-ratio: 1 / 1;
      display: block;
      object-fit: cover;
      background: var(--blue-soft);
    }
    .album-type {
      display: inline-block;
      margin-bottom: 9px;
      padding: 5px 9px;
      border-radius: 999px;
      background: rgba(217, 37, 37, .09);
      color: var(--red);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .5px;
    }
    /* =========================
       MEDIA
    ========================= */
    .media-card {
      padding: 18px;
    }
    .media-type {
      display: inline-block;
      margin-bottom: 9px;
      padding: 5px 9px;
      border-radius: 999px;
      background: rgba(22, 132, 71, .10);
      color: var(--green);
      font-size: 10px;
      font-weight: 900;
    }
    /* =========================
       BUTTONS
    ========================= */
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin-top: 13px;
      padding: 11px 15px;
      border: none;
      border-radius: 10px;
      background: var(--blue-dark);
      color: white;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
    }
    .button:hover {
      background: var(--blue);
    }
    .button.yellow {
      background: var(--yellow);
      color: var(--text);
    }
    .button.green {
      background: var(--green);
    }
    /* =========================
       EMPTY / NOTICE
    ========================= */
    .empty {
      padding: 30px 20px;
      border: 1px dashed #bfd8e5;
      border-radius: 15px;
      background: white;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }
    .notice {
      padding: 20px;
      border-radius: 15px;
      background: var(--blue-soft);
      border: 1px solid #cce7f4;
      color: #245a78;
    }
    .loading {
      max-width: 700px;
      margin: auto;
      padding: 100px 20px;
      text-align: center;
      color: var(--muted);
    }
    .loading-dot {
      width: 42px;
      height: 42px;
      margin: 0 auto 15px;
      border: 4px solid #dceef6;
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
    /* =========================
       FOOTER
    ========================= */
    footer {
      padding: 38px 20px;
      background: white;
      border-top: 1px solid var(--border);
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }
    footer strong {
      color: var(--blue-dark);
      font-size: 16px;
    }
    .flag-line {
      width: 90px;
      height: 4px;
      margin: 14px auto;
      border-radius: 10px;
      background:
        linear-gradient(
          90deg,
          var(--green) 0 25%,
          var(--yellow) 25% 50%,
          var(--red) 50% 75%,
          var(--blue) 75% 100%
        );
    }
    /* =========================
       MOBILE
    ========================= */
    @media (max-width: 850px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .hero-inner {
        padding-top: 50px;
        padding-bottom: 55px;
      }
    }
    @media (max-width: 650px) {
      .header-inner {
        min-height: 62px;
        padding: 10px 15px;
      }
      .logo {
        font-size: 18px;
      }
      .back-link {
        padding: 8px 11px;
        font-size: 11px;
      }
      .hero-inner {
        padding: 42px 15px 52px;
        flex-direction: column;
        text-align: center;
      }
      .avatar {
        width: 145px;
        height: 145px;
      }
      .hero-content {
        width: 100%;
      }
      .hero h1 {
        font-size: 45px;
        letter-spacing: -1.5px;
      }
      .hero-bio {
        font-size: 14px;
      }
      .hero-meta {
        justify-content: center;
      }
      main {
        padding: 35px 15px 65px;
      }
      section {
        margin-bottom: 38px;
      }
      .section-heading {
        align-items: start;
        flex-direction: column;
        gap: 5px;
      }
      .section-heading h2 {
        font-size: 23px;
      }
      .grid {
        grid-template-columns: 1fr;
      }
      .track-card {
        padding: 15px;
      }
    }
  </style>
</head>
<body>
<header>
  <div class="header-inner">
    <a href="index.html" class="logo">
      🎧 INDAMORA <span class="logo-play">PLAY</span>
      <small>INDAMORA RECORDS</small>
    </a>
    <a href="index.html" class="back-link">
      ← Retour à INDAMORA PLAY
    </a>
  </div>
</header>
<div id="app">
  <div class="loading">
    <div class="loading-dot"></div>
    Chargement du profil artiste...
  </div>
</div>
<footer>
  <strong>INDAMORA PLAY</strong>
  <div class="flag-line"></div>
  <p>La voix de nos talents.</p>
  <p>La musique d'Afrique centrale 🇨🇫</p>
  <br>
  <p>© INDAMORA RECORDS</p>
</footer>
<script>
const SUPABASE_URL =
  "https://adqsdnqkbitplbhbihiv.supabase.co";
const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_dpjfWOYeNQRmP2nJq5FoMA_8NUuD0HF";
const { createClient } = supabase;
const db = createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);
const app =
  document.getElementById("app");
function escapeHtml(value) {
  if (
    value === null ||
    value === undefined
  ) {
    return "";
  }
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}
function publicImage(url) {
  if (url) {
    return url;
  }
  return "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(`
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="600"
        height="600"
        viewBox="0 0 600 600"
      >
        <rect
          width="600"
          height="600"
          fill="#eaf6fc"
        />
        <circle
          cx="300"
          cy="300"
          r="125"
          fill="#ffffff"
        />
        <text
          x="300"
          y="340"
          text-anchor="middle"
          font-family="Arial"
          font-size="105"
          fill="#1689c7"
        >
          🎤
        </text>
      </svg>
    `);
}
function getArtistId() {
  const params =
    new URLSearchParams(
      window.location.search
    );
  return params.get("id");
}
function getArtistSlug() {
  const params =
    new URLSearchParams(
      window.location.search
    );
  return params.get("slug");
}
async function loadArtist() {
  const artistId =
    getArtistId();
  const artistSlug =
    getArtistSlug();
  if (!artistId && !artistSlug) {
    app.innerHTML = `
      <main>
        <div class="notice">
          <strong>Aucun artiste sélectionné.</strong>
          <br><br>
          Sélectionnez un artiste depuis
          la page Artistes.
          <br><br>
          <a
            class="button"
            href="artists.html"
          >
            DÉCOUVRIR LES ARTISTES
          </a>
        </div>
      </main>
    `;
    return;
  }
  let query =
    db
      .from("artists")
      .select("*")
      .eq("status", "published")
      .limit(1);
  if (artistId) {
    query =
      query.eq(
        "id",
        artistId
      );
  } else {
    query =
      query.eq(
        "slug",
        artistSlug
      );
  }
  const {
    data: artists,
    error: artistError
  } = await query;
  if (artistError) {
    console.error(
      artistError
    );
    app.innerHTML = `
      <main>
        <div class="notice">
          Impossible de charger ce profil artiste.
        </div>
      </main>
    `;
    return;
  }
  const artist =
    artists && artists[0];
  if (!artist) {
    app.innerHTML = `
      <main>
        <div class="notice">
          <strong>Artiste introuvable ou non publié.</strong>
          <br><br>
          <a
            class="button"
            href="artists.html"
          >
            ← Voir les artistes
          </a>
        </div>
      </main>
    `;
    return;
  }
  document.title =
    `${artist.name} — INDAMORA PLAY`;
  const [
    tracksResponse,
    albumsResponse,
    mediaResponse
  ] = await Promise.all([
    db
      .from("tracks")
      .select("*")
      .eq(
        "artist_id",
        artist.id
      )
      .eq(
        "status",
        "published"
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      ),
    db
      .from("albums")
      .select("*")
      .eq(
        "artist_id",
        artist.id
      )
      .eq(
        "status",
        "published"
      )
      .order(
        "release_date",
        {
          ascending: false
        }
      ),
    db
      .from("media")
      .select("*")
      .eq(
        "artist_id",
        artist.id
      )
      .eq(
        "status",
        "published"
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      )
  ]);
  const tracks =
    tracksResponse.data || [];
  const albums =
    albumsResponse.data || [];
  const media =
    mediaResponse.data || [];
  renderArtist(
    artist,
    tracks,
    albums,
    media
  );
}
function renderArtist(
  artist,
  tracks,
  albums,
  media
) {
  const location = [
    artist.city,
    artist.region
  ]
    .filter(Boolean)
    .join(" · ");
  const details = [
    location,
    artist.genre,
    artist.language
  ]
    .filter(Boolean);
  app.innerHTML = `
    <section class="hero">
      <div class="hero-inner">
        <div class="avatar-wrap">
          <img
            class="avatar"
            src="${publicImage(
              artist.avatar_url
            )}"
            alt="Photo de ${escapeHtml(
              artist.name
            )}"
          >
          ${
            artist.verified
              ? `
                <div class="avatar-badge">
                  ✓
                </div>
              `
              : ""
          }
        </div>
        <div class="hero-content">
          <span class="eyebrow">
            INDAMORA PLAY · ARTISTE
          </span>
          <h1>
            ${escapeHtml(
              artist.name
            )}
          </h1>
          <p class="hero-bio">
            ${escapeHtml(
              artist.bio ||
              "Bienvenue sur le profil officiel de cet artiste."
            )}
          </p>
          ${
            details.length
              ? `
                <div class="hero-meta">
                  ${details.map(
                    detail => `
                      <span class="meta-pill">
                        ${escapeHtml(
                          detail
                        )}
                      </span>
                    `
                  ).join("")}
                </div>
              `
              : ""
          }
          ${
            artist.verified
              ? `
                <span class="verified">
                  ✓ Artiste vérifié
                </span>
              `
              : ""
          }
        </div>
      </div>
    </section>
    <main>
      <section>
        <div class="section-heading">
          <div>
            <h2>🎵 Musiques</h2>
            <p>
              Écoutez les morceaux publiés par cet artiste.
            </p>
          </div>
        </div>
        <div
          id="tracksGrid"
          class="grid"
        ></div>
      </section>
      <section>
        <div class="section-heading">
          <div>
            <h2>💿 Albums & projets</h2>
            <p>
              Retrouvez les projets disponibles sur INDAMORA PLAY.
            </p>
          </div>
        </div>
        <div
          id="albumsGrid"
          class="grid"
        ></div>
      </section>
      <section>
        <div class="section-heading">
          <div>
            <h2>🎬 Clips & podcasts</h2>
            <p>
              Découvrez également ses autres créations.
            </p>
          </div>
        </div>
        <div
          id="mediaGrid"
          class="grid"
        ></div>
      </section>
    </main>
  `;
  renderTracks(tracks);
  renderAlbums(albums);
  renderMedia(media);
}
function renderTracks(tracks) {
  const container =
    document.getElementById(
      "tracksGrid"
    );
  if (!tracks.length) {
    container.innerHTML = `
      <div
        class="empty"
        style="grid-column:1/-1;"
      >
        Aucun morceau publié pour le moment.
      </div>
    `;
    return;
  }
  container.innerHTML =
    tracks.map(
      (track, index) => `
        <div class="card track-card">
          <div class="track-top">
            <div>
              <h3>
                ${escapeHtml(
                  track.title
                )}
              </h3>
              <div class="meta">
                ${
                  track.genre
                    ? escapeHtml(
                        track.genre
                      )
                    : ""
                }
                ${
                  track.language
                    ? " · " +
                      escapeHtml(
                        track.language
                      )
                    : ""
                }
              </div>
            </div>
            <div class="track-number">
              ${index + 1}
            </div>
          </div>
          ${
            track.audio_url
              ? `
                <audio
                  controls
                  preload="none"
                  src="${escapeHtml(
                    track.audio_url
                  )}"
                ></audio>
              `
              : `
                <div class="notice">
                  Audio disponible après
                  publication du fichier.
                </div>
              `
          }
          <span class="play-count">
            ${Number(
              track.play_count || 0
            )}
            écoute(s)
          </span>
        </div>
      `
    ).join("");
}
function renderAlbums(albums) {
  const container =
    document.getElementById(
      "albumsGrid"
    );
  if (!albums.length) {
    container.innerHTML = `
      <div
        class="empty"
        style="grid-column:1/-1;"
      >
        Aucun album ou projet publié
        pour le moment.
      </div>
    `;
    return;
  }
  container.innerHTML =
    albums.map(
      album => `
        <div class="card">
          <img
            class="cover"
            src="${publicImage(
              album.cover_url
            )}"
            alt="Pochette ${escapeHtml(
              album.title
            )}"
            loading="lazy"
          >
          <div class="card-body">
            <span class="album-type">
              ${escapeHtml(
                String(
                  album.type || ""
                ).toUpperCase()
              )}
            </span>
            <h3>
              ${escapeHtml(
                album.title
              )}
            </h3>
            <div class="meta">
              ${
                album.release_date
                  ? `
                    Sortie :
                    ${escapeHtml(
                      album.release_date
                    )}
                  `
                  : ""
              }
            </div>
            ${
              album.description
                ? `
                  <p
                    class="meta"
                    style="margin-top:10px;"
                  >
                    ${escapeHtml(
                      album.description
                    )}
                  </p>
                `
                : ""
            }
          </div>
        </div>
      `
    ).join("");
}
function renderMedia(media) {
  const container =
    document.getElementById(
      "mediaGrid"
    );
  if (!media.length) {
    container.innerHTML = `
      <div
        class="empty"
        style="grid-column:1/-1;"
      >
        Aucun clip ou podcast publié
        pour le moment.
      </div>
    `;
    return;
  }
  container.innerHTML =
    media.map(
      item => `
        <div class="card media-card">
          <span class="media-type">
            ${escapeHtml(
              String(
                item.type || ""
              ).toUpperCase()
            )}
          </span>
          <h3>
            ${escapeHtml(
              item.title
            )}
          </h3>
          ${
            item.description
              ? `
                <p
                  class="meta"
                  style="margin-top:8px;"
                >
                  ${escapeHtml(
                    item.description
                  )}
                </p>
              `
              : ""
          }
          ${
            item.media_url
              ? `
                <a
                  class="button green"
                  href="${escapeHtml(
                    item.media_url
                  )}"
                  target="_blank"
                  rel="noopener"
                >
                  ▶ OUVRIR LE MÉDIA
                </a>
              `
              : `
                <div
                  class="notice"
                  style="margin-top:13px;"
                >
                  Média en attente de son lien.
                </div>
              `
          }
        </div>
      `
    ).join("");
}
loadArtist();
</script>
