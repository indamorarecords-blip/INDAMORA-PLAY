<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mes catégories — INDAMORA PLAY</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{
  box-sizing:border-box;
}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f9ff;
  color:#123;
}
header{
  background:#0866d6;
  color:white;
  padding:20px;
  text-align:center;
}
header h1{
  margin:0;
  font-size:25px;
}
header p{
  margin:7px 0 0;
}
main{
  max-width:950px;
  margin:30px auto;
  padding:0 18px;
}
.card{
  background:white;
  border-radius:16px;
  padding:25px;
  box-shadow:0 5px 20px rgba(0,70,150,.08);
}
h2{
  color:#0866d6;
  margin-top:0;
}
.info{
  color:#52677d;
  line-height:1.5;
}
.search{
  width:100%;
  padding:14px;
  margin:18px 0;
  border:1px solid #c9d8ea;
  border-radius:10px;
  font-size:16px;
  outline:none;
}
.search:focus{
  border-color:#0866d6;
}
.categories{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:12px;
}
.category{
  border:2px solid #dbe7f5;
  background:white;
  border-radius:12px;
  padding:15px;
  cursor:pointer;
  user-select:none;
  font-size:15px;
  transition:.15s;
}
.category:hover{
  border-color:#0866d6;
  background:#f5f9ff;
}
.category.selected{
  border-color:#0866d6;
  background:#eaf3ff;
  color:#0756ad;
  font-weight:bold;
}
.category input{
  position:absolute;
  opacity:0;
  pointer-events:none;
}
.save{
  width:100%;
  margin-top:25px;
  padding:15px;
  border:0;
  border-radius:11px;
  background:#0866d6;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}
.save:hover{
  background:#0756ad;
}
.save:disabled{
  opacity:.6;
  cursor:not-allowed;
}
.count{
  margin-top:16px;
  font-weight:bold;
  color:#0866d6;
}
.message{
  margin-top:18px;
  padding:14px;
  border-radius:10px;
  display:none;
}
.message.success{
  display:block;
  background:#eaf8ef;
  color:#176b36;
}
.message.error{
  display:block;
  background:#fff0f0;
  color:#a32121;
}
.loading{
  text-align:center;
  color:#52677d;
  padding:25px;
}
</style>
</head>
<body>
<header>
  <h1>INDAMORA PLAY</h1>
  <p>Mes catégories</p>
</header>
<main>
<div class="card">
<h2>Choisis tes catégories</h2>
<p class="info">
Sélectionne une ou plusieurs catégories qui correspondent à ton activité.
Tu peux en choisir plusieurs.
</p>

<input
id=“search”
class=“search”
type=“search”
placeholder=“Rechercher une catégorie…”

<div id="categories" class="categories">
  <div class="loading">Chargement des catégories...</div>
</div>
<div id="count" class="count">
  0 catégorie sélectionnée
</div>
<button id="saveBtn" class="save">
  Enregistrer mes catégories
</button>
<div id="message" class="message"></div>
</div>
</main>
<script>
const SUPABASE_URL =
"https://adqsdnqkbitplbhbihiv.supabase.co";
const SUPABASE_KEY =
"sb_publishable_dpjfWOYeNQRmP2nJq5FoMA_8NUuD0HF";
const client =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);
let categories = [];
let selectedIds = new Set();
let artistId = null;
const categoriesEl =
document.getElementById("categories");
const searchEl =
document.getElementById("search");
const countEl =
document.getElementById("count");
const saveBtn =
document.getElementById("saveBtn");
const messageEl =
document.getElementById("message");
function message(text,type){
  messageEl.textContent = text;
  messageEl.className =
    "message " + type;
}
function updateCount(){
  const n = selectedIds.size;
  countEl.textContent =
    n +
    (n > 1
      ? " catégories sélectionnées"
      : " catégorie sélectionnée");
}
function render(){
  const search =
    searchEl.value
      .trim()
      .toLowerCase();
  categoriesEl.innerHTML = "";
  const filtered =
    categories.filter(category =>
      category.name
        .toLowerCase()
        .includes(search)
    );
  if(filtered.length === 0){
    categoriesEl.innerHTML =
      "<p>Aucune catégorie trouvée.</p>";
    return;
  }
  filtered.forEach(category => {
    const div =
      document.createElement("div");
    div.className =
      "category" +
      (
        selectedIds.has(category.id)
        ? " selected"
        : ""
      );
    div.innerHTML =
      "<input type='checkbox'>" +
      "<span>" +
      (category.icon || "") +
      " " +
      category.name +
      "</span>";
    div.addEventListener("click",function(){
      if(selectedIds.has(category.id)){
        selectedIds.delete(category.id);
      }else{
        selectedIds.add(category.id);
      }
      render();
    });
    categoriesEl.appendChild(div);
  });
  updateCount();
}
async function getArtist(){
  const result =
    await client.auth.getUser();
  const user =
    result.data.user;
  if(!user){
    message(
      "Connecte-toi d'abord à ton compte artiste.",
      "error"
    );
    saveBtn.disabled = true;
    return false;
  }
  const resultArtist =
    await client
      .from("artists")
      .select("id")
      .eq("owner_id",user.id)
      .maybeSingle();
  if(resultArtist.error){
    console.error(resultArtist.error);
    message(
      "Impossible de récupérer ton profil artiste.",
      "error"
    );
    return false;
  }
  if(!resultArtist.data){
    message(
      "Aucun profil artiste n'est encore associé à ce compte.",
      "error"
    );
    saveBtn.disabled = true;
    return false;
  }
  artistId =
    resultArtist.data.id;
  return true;
}
async function loadCategories(){
  const result =
    await client
      .from("categories")
      .select("id,slug,name,icon")
      .eq("active",true)
      .order("name");
  if(result.error){
    console.error(result.error);
    message(
      "Impossible de charger les catégories.",
      "error"
    );
    return;
  }
  categories =
    result.data || [];
  if(artistId){
    const selected =
      await client
        .from("artist_categories")
        .select("category_id")
        .eq("artist_id",artistId);
    if(!selected.error){
      selected.data.forEach(row => {
        selectedIds.add(
          row.category_id
        );
      });
    }
  }
  render();
}
searchEl.addEventListener(
  "input",
  render
);
saveBtn.addEventListener(
  "click",
  async function(){
    if(!artistId){
      message(
        "Profil artiste introuvable.",
        "error"
      );
      return;
    }
    saveBtn.disabled = true;
    saveBtn.textContent =
      "Enregistrement...";
    try{
      const remove =
        await client
          .from("artist_categories")
          .delete()
          .eq("artist_id",artistId);
      if(remove.error){
        throw remove.error;
      }
      if(selectedIds.size > 0){
        const rows =
          Array.from(selectedIds)
            .map(categoryId => ({
              artist_id:artistId,
              category_id:categoryId
            }));
        const insert =
          await client
            .from("artist_categories")
            .insert(rows);
        if(insert.error){
          throw insert.error;
        }
      }
      message(
        "Tes catégories ont bien été enregistrées.",
        "success"
      );
    }catch(error){
      console.error(error);
      message(
        "Erreur pendant l'enregistrement des catégories.",
        "error"
      );
    }
    saveBtn.disabled = false;
    saveBtn.textContent =
      "Enregistrer mes catégories";
  }
);
(async function(){
  const artistOk =
    await getArtist();
  if(artistOk){
    await loadCategories();
  }
})();
</script>
</body>
</html>
