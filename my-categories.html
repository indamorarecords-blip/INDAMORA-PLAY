<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes catégories — INDAMORA PLAY</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#fff;color:#123}
    header{background:#0b63ce;color:#fff;padding:18px 20px}
    header h1{margin:0;font-size:24px}
    header p{margin:6px 0 0;opacity:.9}
    main{max-width:900px;margin:30px auto;padding:0 18px}
    .card{border:1px solid #dbe7f5;border-radius:14px;padding:22px;background:#fff;box-shadow:0 4px 16px rgba(0,70,150,.06)}
    h2{color:#0b63ce;margin-top:0}
    .search{width:100%;padding:13px;border:1px solid #cbd8e8;border-radius:10px;margin:12px 0 20px;font-size:16px}
    .categories{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
    label{display:flex;align-items:center;gap:10px;padding:13px;border:1px solid #dbe7f5;border-radius:10px;cursor:pointer}
    label:hover{background:#f4f8ff}
    input[type="checkbox"]{width:18px;height:18px}
    button{margin-top:22px;background:#0b63ce;color:#fff;border:0;padding:13px 22px;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer}
    button:hover{background:#084f9f}
    .message{margin-top:18px;padding:12px;border-radius:10px;display:none}
    .success{display:block;background:#eaf7ee;color:#176b36}
    .error{display:block;background:#fff0f0;color:#a32121}
    .info{margin-bottom:18px;color:#50657d;line-height:1.5}
    .count{margin-top:12px;color:#0b63ce;font-weight:bold}
    a{color:#0b63ce}
  </style>
</head>
<body>
<header>
  <h1>INDAMORA PLAY</h1>
  <p>Mes catégories</p>
</header>
<main>
  <div class="card">
    <h2>Choisis tes catégories</h2>
<p class="info">
  Tu peux sélectionner plusieurs catégories correspondant à ton activité.
  Ces catégories pourront être utilisées pour mieux présenter ton profil
  sur INDAMORA PLAY.
</p>
<input
  id="search"
  class="search"
  type="search"
  placeholder="Rechercher une catégorie..."
>
<div id="categories" class="categories"></div>
<div id="count" class="count">0 catégorie sélectionnée</div>
<button id="saveBtn">Enregistrer mes catégories</button>
<div id="message" class="message"></div>
  </div>
</main>
<script>
const SUPABASE_URL = "https://adqsdnqkbitplbhbihiv.supabase.co";
const SUPABASE_KEY = "sb_publishable_dpjfWOYeNQRmP2nJq5FoMA_8NUuD0HF";
const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);
let allCategories = [];
let artistId = null;
const categoriesEl = document.getElementById("categories");
const searchEl = document.getElementById("search");
const countEl = document.getElementById("count");
const saveBtn = document.getElementById("saveBtn");
const messageEl = document.getElementById("message");
const slugFallback = [
  ["artistes-chanteurs","Artistes & chanteurs","🎤"],
  ["gospel","Gospel","🙏"],
  ["chantres","Chantres","🎼"],
  ["serviteurs-de-dieu","Serviteurs de Dieu","⛪"],
  ["predicateurs-enseignants","Prédicateurs & enseignants","📖"],
  ["cinema","Cinéma","🎬"],
  ["videastes-videos","Vidéastes & vidéos","🎥"],
  ["humour","Humour","😂"],
  ["podcasts","Podcasts","🎧"],
  ["createurs-de-contenu","Créateurs de contenu","📱"],
  ["influenceurs","Influenceurs","⭐"],
  ["producteurs-beatmakers","Producteurs & beatmakers","🎼"],
  ["medias","Médias","📻"],
  ["labels-structures","Labels & structures","🏷️"],
  ["associations-organisations","Associations & organisations","🌍"],
  ["danseurs","Danseurs","💃"],
  ["couturiers","Couturiers","🧵"],
  ["agences-de-communication","Agences de communication","📣"],
  ["agences-de-voyage","Agences de voyage","✈️"],
  ["conteurs","Conteurs","📚"]
];
function showMessage(text, type) {
  messageEl.textContent = text;
  messageEl.className = "message " + type;
}
function updateCount() {
  const checked = document.querySelectorAll(
    '#categories input[type="checkbox"]:checked'
  ).length;
  countEl.textContent =
    checked + (checked > 1 ? " catégories sélectionnées" : " catégorie sélectionnée");
}
function renderCategories(filter = "") {
  const q = filter.trim().toLowerCase();
  categoriesEl.innerHTML = "";
  const filtered = allCategories.filter(category =>
    category.name.toLowerCase().includes(q)
  );
  if (!filtered.length) {
    categoriesEl.innerHTML =
      "<p>Aucune catégorie trouvée.</p>";
    return;
  }
  filtered.forEach(category => {
    const label = document.createElement("label");
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.value = category.id;
    checkbox.dataset.slug = category.slug;
    if (category.selected) {
      checkbox.checked = true;
    }
    checkbox.addEventListener("change", updateCount);
    const text = document.createElement("span");
    text.textContent =
      (category.icon ? category.icon + " " : "") + category.name;
    label.appendChild(checkbox);
    label.appendChild(text);
    categoriesEl.appendChild(label);
  });
  updateCount();
}
async function loadArtist() {
  const {
    data: { user },
    error
  } = await supabaseClient.auth.getUser();
  if (error || !user) {
    showMessage(
      "Tu dois être connecté pour gérer tes catégories.",
      "error"
    );
    saveBtn.disabled = true;
    return false;
  }
  const { data: artist, error: artistError } =
    await supabaseClient
      .from("artists")
      .select("id")
      .eq("owner_id", user.id)
      .maybeSingle();
  if (artistError) {
    console.error(artistError);
    showMessage(
      "Impossible de récupérer ton profil artiste.",
      "error"
    );
    return false;
  }
  if (!artist) {
    showMessage(
      "Aucun profil artiste n'est encore associé à ce compte.",
      "error"
    );
    saveBtn.disabled = true;
    return false;
  }
  artistId = artist.id;
  return true;
}
async function loadCategories() {
  const { data: categories, error } =
    await supabaseClient
      .from("categories")
      .select("id,slug,name,icon")
      .eq("active", true)
      .order("name");
  if (error) {
    console.error(error);
    allCategories = slugFallback.map(item => ({
      slug: item[0],
      name: item[1],
      icon: item[2],
      id: item[0],
      selected: false
    }));
    renderCategories();
    return;
  }
  allCategories = categories || [];
  if (artistId) {
    const { data: selected, error: selectedError } =
      await supabaseClient
        .from("artist_categories")
        .select("category_id")
        .eq("artist_id", artistId);
    if (!selectedError && selected) {
      const selectedIds = new Set(
        selected.map(row => row.category_id)
      );
      allCategories = allCategories.map(category => ({
        ...category,
        selected: selectedIds.has(category.id)
      }));
    }
  }
  renderCategories();
}
searchEl.addEventListener("input", () => {
  renderCategories(searchEl.value);
});
saveBtn.addEventListener("click", async () => {
  if (!artistId) {
    showMessage(
      "Profil artiste introuvable.",
      "error"
    );
    return;
  }
  saveBtn.disabled = true;
  saveBtn.textContent = "Enregistrement...";
  try {
    const selectedIds = Array.from(
      document.querySelectorAll(
        '#categories input[type="checkbox"]:checked'
      )
    ).map(input => input.value);
    const { error: deleteError } =
      await supabaseClient
        .from("artist_categories")
        .delete()
        .eq("artist_id", artistId);
    if (deleteError) {
      throw deleteError;
    }
    if (selectedIds.length > 0) {
      const rows = selectedIds.map(categoryId => ({
        artist_id: artistId,
        category_id: categoryId
      }));
      const { error: insertError } =
        await supabaseClient
          .from("artist_categories")
          .insert(rows);
      if (insertError) {
        throw insertError;
      }
    }
    showMessage(
      "Tes catégories ont bien été enregistrées.",
      "success"
    );
  } catch (error) {
    console.error(error);
    showMessage(
      "Une erreur est survenue pendant l'enregistrement.",
      "error"
    );
  }
  saveBtn.disabled = false;
  saveBtn.textContent = "Enregistrer mes catégories";
});
(async function init() {
  const ok = await loadArtist();
  if (ok) {
    await loadCategories();
  }
})();
</script>
</body>
</html>
