<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mes catégories — INDAMORA PLAY</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f9ff;
  color:#123;
}
header{
  background:#0866d6;
  color:#fff;
  padding:20px;
  text-align:center;
}
header h1{
  margin:0;
  font-size:25px;
}
header p{
  margin:7px 0 0;
}
main{
  max-width:950px;
  margin:30px auto;
  padding:0 18px;
}
.card{
  background:#fff;
  border-radius:16px;
  padding:25px;
  box-shadow:0 5px 20px rgba(0,70,150,.08);
}
h2{
  color:#0866d6;
  margin-top:0;
}
.info{
  color:#52677d;
  line-height:1.5;
}
.search{
  width:100%;
  padding:14px;
  margin:18px 0;
  border:1px solid #c9d8ea;
  border-radius:10px;
  font-size:16px;
}
.categories{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:12px;
}
.category{
  border:2px solid #dbe7f5;
  background:#fff;
  border-radius:12px;
  padding:15px;
  cursor:pointer;
  user-select:none;
  transition:.15s;
}
.category:hover{
  border-color:#0866d6;
  background:#f5f9ff;
}
.category.selected{
  border-color:#0866d6;
  background:#e8f2ff;
  color:#0756ad;
  font-weight:bold;
}
.count{
  margin-top:18px;
  color:#0866d6;
  font-weight:bold;
}
button{
  width:100%;
  margin-top:24px;
  padding:15px;
  border:0;
  border-radius:11px;
  background:#0866d6;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}
button:hover{
  background:#0756ad;
}
button:disabled{
  opacity:.6;
}
.message{
  display:none;
  margin-top:18px;
  padding:14px;
  border-radius:10px;
}
.success{
  display:block;
  background:#eaf8ef;
  color:#176b36;
}
.error{
  display:block;
  background:#fff0f0;
  color:#a32121;
}
</style>
</head>
<body>
<header>
  <h1>INDAMORA PLAY</h1>
  <p>Mes catégories</p>
</header>
<main>
<div class="card">
<h2>Choisis tes catégories</h2>
<p class="info">
Sélectionne une ou plusieurs catégories correspondant à ton activité.
Tu peux en choisir plusieurs.
</p>

<input
id=“search”
class=“search”
type=“search”
placeholder=“Rechercher une catégorie…”

<div id="categories" class="categories"></div>
<div id="count" class="count">
0 catégorie sélectionnée
</div>
<button id="saveBtn">
Enregistrer mes catégories
</button>
<div id="message" class="message"></div>
</div>
</main>
<script>
const SUPABASE_URL =
"https://adqsdnqkbitplbhbihiv.supabase.co";
const SUPABASE_KEY =
"sb_publishable_dpjfWOYeNQRmP2nJq5FoMA_8NUuD0HF";
const categories = [
["1","🎤","Artistes & chanteurs"],
["2","🙏","Gospel"],
["3","🎼","Chantres"],
["4","⛪","Serviteurs de Dieu"],
["5","📖","Prédicateurs & enseignants"],
["6","🎬","Cinéma"],
["7","🎥","Vidéastes & vidéos"],
["8","😂","Humour"],
["9","🎧","Podcasts"],
["10","📱","Créateurs de contenu"],
["11","⭐","Influenceurs"],
["12","🎼","Producteurs & beatmakers"],
["13","📻","Médias"],
["14","🏷️","Labels & structures"],
["15","🌍","Associations & organisations"],
["16","💃","Danseurs"],
["17","🧵","Couturiers"],
["18","📣","Agences de communication"],
["19","✈️","Agences de voyage"],
["20","📚","Conteurs"]
];
let selected = new Set();
const categoriesEl =
document.getElementById("categories");
const searchEl =
document.getElementById("search");
const countEl =
document.getElementById("count");
const saveBtn =
document.getElementById("saveBtn");
const messageEl =
document.getElementById("message");
function showMessage(text,type){
  messageEl.textContent = text;
  messageEl.className =
    "message " + type;
}
function updateCount(){
  const n = selected.size;
  countEl.textContent =
    n +
    (n > 1
      ? " catégories sélectionnées"
      : " catégorie sélectionnée");
}
function render(){
  const search =
    searchEl.value
      .toLowerCase()
      .trim();
  categoriesEl.innerHTML = "";
  categories
    .filter(item =>
      item[2]
        .toLowerCase()
        .includes(search)
    )
    .forEach(item => {
      const div =
        document.createElement("div");
      div.className =
        "category" +
        (
          selected.has(item[0])
          ? " selected"
          : ""
        );
      div.innerHTML =
        item[1] +
        " " +
        item[2];
      div.addEventListener(
        "click",
        function(){
          if(selected.has(item[0])){
            selected.delete(item[0]);
          }else{
            selected.add(item[0]);
          }
          render();
        }
      );
      categoriesEl.appendChild(div);
    });
  updateCount();
}
searchEl.addEventListener(
  "input",
  render
);
saveBtn.addEventListener(
  "click",
  async function(){
    showMessage(
      "Pour enregistrer tes catégories, connecte-toi à ton compte artiste.",
      "error"
    );
  }
);
render();
</script>
</body>
</html>
