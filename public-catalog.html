<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalogue — INDAMORA PLAY</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --blue: #1689C7;
      --blue-dark: #0757B8;
      --blue-soft: #EAF6FC;
      --red: #D92525;
      --yellow: #F2C230;
      --green: #168447;
      --white: #FFFFFF;
      --cream: #FFFDF8;
      --text: #18324A;
      --muted: #6D7F8F;
      --border: #E1EDF3;
      --border-strong: #C7E2ED;
      --shadow: 0 16px 45px rgba(22, 137, 199, 0.08);
      --shadow-hover: 0 24px 55px rgba(22, 137, 199, 0.15);
      --radius: 24px;
    }
    * {
      box-sizing: border-box;
    }
    html {
      scroll-behavior: smooth;
    }
    body {
      margin: 0;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        Helvetica,
        sans-serif;
      color: var(--text);
      min-height: 100vh;
      background:
        radial-gradient(
          circle at 0% 0%,
          rgba(242, 194, 48, 0.13),
          transparent 25%
        ),
        radial-gradient(
          circle at 100% 5%,
          rgba(22, 132, 71, 0.08),
          transparent 24%
        ),
        linear-gradient(
          180deg,
          var(--cream) 0%,
          var(--white) 45%,
          #F4FBFE 100%
        );
    }
    a {
      color: inherit;
    }
    /* HEADER */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 255, 255, 0.95);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow:
        0 5px 25px rgba(22, 137, 199, 0.05);
    }
    .header-inner {
      width: min(1180px, calc(100% - 32px));
      min-height: 76px;
      margin: 0 auto;
      padding: 12px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 11px;
      color: var(--blue-dark);
      font-size: 20px;
      font-weight: 950;
      letter-spacing: -0.6px;
    }
    .logo-mark {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 15px;
      background:
        linear-gradient(
          135deg,
          var(--blue),
          var(--blue-dark)
        );
      color: var(--white);
      font-size: 20px;
      box-shadow:
        0 9px 23px rgba(22, 137, 199, 0.20);
    }
    .back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 16px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: var(--white);
      color: var(--blue-dark);
      text-decoration: none;
      font-size: 13px;
      font-weight: 900;
      transition:
        transform .2s ease,
        background .2s ease,
        border-color .2s ease,
        box-shadow .2s ease;
    }
    .back:hover {
      transform: translateY(-2px);
      background: var(--blue-soft);
      border-color: var(--border-strong);
      box-shadow:
        0 8px 20px rgba(22, 137, 199, 0.08);
    }
    /* MAIN */
    main {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 42px 0 35px;
    }
    /* HERO */
    .hero {
      position: relative;
      overflow: hidden;
      margin-bottom: 52px;
      padding: 52px 44px;
      border: 1px solid var(--border);
      border-radius: 32px;
      background:
        radial-gradient(
          circle at 88% 15%,
          rgba(22, 137, 199, 0.12),
          transparent 30%
        ),
        linear-gradient(
          135deg,
          rgba(255,255,255,.98),
          rgba(234,246,252,.94)
        );
      box-shadow: var(--shadow);
    }
    .hero::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 6px;
      background:
        linear-gradient(
          90deg,
          var(--blue) 0 35%,
          var(--red) 35% 55%,
          var(--yellow) 55% 75%,
          var(--green) 75% 100%
        );
    }
    .hero::after {
      content: "♪";
      position: absolute;
      right: 38px;
      bottom: -42px;
      color: rgba(22, 137, 199, 0.07);
      font-size: 220px;
      line-height: 1;
      pointer-events: none;
    }
    .hero-badge {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 19px;
      padding: 9px 15px;
      border: 1px solid #CDE8F4;
      border-radius: 999px;
      background: var(--white);
      color: var(--blue-dark);
      font-size: 12px;
      font-weight: 950;
      letter-spacing: .35px;
      text-transform: uppercase;
      box-shadow:
        0 7px 20px rgba(22, 137, 199, 0.06);
    }
    h1 {
      position: relative;
      z-index: 1;
      margin: 0 0 15px;
      color: var(--text);
      font-size: clamp(36px, 6vw, 62px);
      line-height: .98;
      letter-spacing: -2.4px;
    }
    .hero-title-accent {
      color: var(--blue-dark);
    }
    .intro {
      position: relative;
      z-index: 1;
      max-width: 730px;
      margin: 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.75;
    }
    /* SECTIONS */
    .section {
      margin-bottom: 62px;
    }
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 24px;
    }
    .section-heading-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .section-icon {
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      background: var(--blue-soft);
      border: 1px solid #CDE8F4;
      font-size: 23px;
      box-shadow:
        0 8px 20px rgba(22, 137, 199, 0.06);
    }
    .section-title {
      margin: 0;
      color: var(--text);
      font-size: clamp(26px, 3vw, 34px);
      line-height: 1.1;
      letter-spacing: -1px;
    }
    .section-line {
      width: 62px;
      height: 4px;
      margin-top: 9px;
      border-radius: 999px;
      background:
        linear-gradient(
          90deg,
          var(--blue),
          var(--red),
          var(--yellow),
          var(--green)
        );
    }
    /* GRID */
    .grid {
      display: grid;
      grid-template-columns:
        repeat(
          auto-fill,
          minmax(225px, 1fr)
        );
      gap: 22px;
    }
    /* CARDS */
    .card {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background:
        linear-gradient(
          180deg,
          #FFFFFF 0%,
          #FBFEFF 100%
        );
      box-shadow: var(--shadow);
      transition:
        transform .25s ease,
        box-shadow .25s ease,
        border-color .25s ease;
    }
    .card:hover {
      transform: translateY(-7px);
      border-color: var(--border-strong);
      box-shadow: var(--shadow-hover);
    }
    .card::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 4px;
      background:
        linear-gradient(
          90deg,
          var(--blue),
          var(--red),
          var(--yellow),
          var(--green)
        );
      opacity: 0;
      transition: opacity .25s ease;
    }
    .card:hover::after {
      opacity: 1;
    }
    .image,
    .placeholder {
      width: 100%;
      aspect-ratio: 1 / 1;
      display: block;
    }
    .image {
      object-fit: cover;
      background: var(--blue-soft);
      transition: transform .4s ease;
    }
    .card:hover .image {
      transform: scale(1.04);
    }
    .placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(
          circle at 25% 20%,
          rgba(242, 194, 48, .20),
          transparent 26%
        ),
        radial-gradient(
          circle at 80% 80%,
          rgba(22, 132, 71, .10),
          transparent 28%
        ),
        linear-gradient(
          135deg,
          var(--blue-soft),
          #F9FDFF
        );
      color: var(--blue-dark);
      font-size: 60px;
    }
    .card-body {
      padding: 20px;
    }
    .card-title {
      margin-bottom: 9px;
      color: var(--text);
      font-size: 18px;
      font-weight: 950;
      line-height: 1.35;
    }
    .meta {
      min-height: 23px;
      margin-bottom: 15px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }
    /* VERIFIED */
    .verified {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 15px;
      padding: 6px 9px;
      border-radius: 999px;
      background: var(--green-soft);
      color: var(--green);
      font-size: 12px;
      font-weight: 900;
    }
    .verified-dot {
      width: 19px;
      height: 19px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: var(--white);
      border: 1px solid #C5E9D5;
      font-size: 11px;
    }
    /* BUTTONS */
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-height: 46px;
      padding: 12px 16px;
      border-radius: 13px;
      background:
        linear-gradient(
          135deg,
          var(--blue),
          var(--blue-dark)
        );
      color: var(--white);
      text-decoration: none;
      font-size: 13px;
      font-weight: 950;
      box-shadow:
        0 9px 20px rgba(7, 87, 184, 0.14);
      transition:
        transform .2s ease,
        box-shadow .2s ease;
    }
    .button:hover {
      transform: translateY(-2px);
      box-shadow:
        0 13px 28px rgba(7, 87, 184, 0.21);
    }
    /* NOTICE */
    .notice {
      grid-column: 1 / -1;
      padding: 27px 22px;
      border: 1px dashed #BFDCE9;
      border-radius: 20px;
      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,.94),
          rgba(234,246,252,.72)
        );
      color: var(--muted);
      text-align: center;
      line-height: 1.7;
      box-shadow:
        0 8px 25px rgba(22, 137, 199, 0.05);
    }
    /* FOOTER */
    footer {
      margin-top: 35px;
      padding: 44px 20px 52px;
      border-top: 1px solid var(--border);
      background:
        linear-gradient(
          180deg,
          #FFFFFF,
          #F4FBFE
        );
      color: var(--muted);
      text-align: center;
      font-size: 13px;
      line-height: 1.7;
    }
    footer strong {
      color: var(--blue-dark);
      font-size: 18px;
      font-weight: 950;
    }
    .footer-accent {
      width: 95px;
      height: 4px;
      margin: 13px auto 16px;
      border-radius: 999px;
      background:
        linear-gradient(
          90deg,
          var(--blue),
          var(--red),
          var(--yellow),
          var(--green)
        );
    }
    /* MOBILE */
    @media (max-width: 700px) {
      .header-inner {
        width: min(100% - 22px, 600px);
        min-height: 66px;
      }
      .logo {
        font-size: 17px;
      }
      .logo-mark {
        width: 37px;
        height: 37px;
        border-radius: 12px;
        font-size: 17px;
      }
      .back {
        padding: 9px 12px;
        font-size: 12px;
      }
      main {
        width: min(100% - 22px, 600px);
        padding-top: 25px;
      }
      .hero {
        padding: 36px 22px;
        border-radius: 25px;
        margin-bottom: 40px;
      }
      h1 {
        font-size: 39px;
      }
      .intro {
        font-size: 15px;
      }
      .hero::after {
        right: 7px;
        font-size: 135px;
      }
      .section {
        margin-bottom: 46px;
      }
      .section-title {
        font-size: 27px;
      }
      .section-icon {
        width: 45px;
        height: 45px;
        border-radius: 14px;
      }
      .grid {
        grid-template-columns:
          repeat(
            2,
            minmax(0, 1fr)
          );
        gap: 13px;
      }
      .card {
        border-radius: 18px;
      }
      .card-body {
        padding: 14px;
      }
      .card-title {
        font-size: 15px;
      }
      .meta {
        font-size: 12px;
      }
      .button {
        min-height: 42px;
        padding: 10px;
        font-size: 12px;
      }
    }
    @media (max-width: 420px) {
      .grid {
        grid-template-columns: 1fr;
      }
      .card-title {
        font-size: 17px;
      }
      .button {
        width: auto;
        padding-left: 15px;
        padding-right: 15px;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }
      .card,
      .image,
      .button,
      .back,
      .card::after {
        transition: none;
      }
    }
  </style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="logo">
      <div class="logo-mark">🎧</div>
      <span>INDAMORA PLAY</span>
    </div>
<a class="back" href="index.html">
  ← Accueil
</a>
  </div>
</header>
<main>
  <section class="hero">
    <div class="hero-badge">
      🇨🇫 Plateforme musicale d’Afrique centrale
    </div>
<h1>
  Catalogue
  <span class="hero-title-accent">
    public
  </span>
</h1>
<p class="intro">
  Découvrez les artistes et albums publiés sur
  INDAMORA PLAY.
</p>
  </section>
  <section class="section">
    <div class="section-header">
      <div class="section-heading-wrap">
        <div class="section-icon">
          🎤
        </div>
    <div>
      <h2 class="section-title">
        Artistes
      </h2>
      <div class="section-line"></div>
    </div>
  </div>
</div>
<div id="artists" class="grid">
  <div class="notice">
    Chargement des artistes...
  </div>
</div>
  </section>
  <section class="section">
    <div class="section-header">
      <div class="section-heading-wrap">
        <div class="section-icon">
          💿
        </div>
    <div>
      <h2 class="section-title">
        Albums
      </h2>
      <div class="section-line"></div>
    </div>
  </div>
</div>
<div id="albums" class="grid">
  <div class="notice">
    Chargement des albums...
  </div>
</div>
  </section>
</main>
<footer>
  <p>
    <strong>🎧 INDAMORA PLAY</strong>
  </p>
  <div class="footer-accent"></div>
  <p>
    INDAMORA RECORDS —
    Musique d’Afrique centrale 🇨🇫
  </p>
</footer>
<script>
  const SUPABASE_URL =
    "https://adqsdnqkbitplbhbihiv.supabase.co";
  const SUPABASE_KEY =
    "sb_publishable_dpjfWOYeNQRmP2nJq5FoMA_8NUuD0HF";
  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );
  async function loadArtists() {
    const container =
      document.getElementById("artists");
    const { data, error } = await db
      .from("artists")
      .select(`
        id,
        name,
        slug,
        bio,
        city,
        region,
        language,
        genre,
        avatar_url,
        verified
      `)
      .eq("status", "published")
      .order("name", {
        ascending: true
      });
    if (error) {
      console.error(error);
      container.innerHTML =
        '<div class="notice">Impossible de charger les artistes.</div>';
      return;
    }
    if (!data || data.length === 0) {
      container.innerHTML =
        '<div class="notice">Aucun artiste publié pour le moment.</div>';
      return;
    }
    container.innerHTML = "";
    data.forEach(artist => {
      const card =
        document.createElement("div");
      card.className = "card";
      if (artist.avatar_url) {
        const img =
          document.createElement("img");
        img.className = "image";
        img.src = artist.avatar_url;
        img.alt = artist.name;
        card.appendChild(img);
      } else {
        const placeholder =
          document.createElement("div");
        placeholder.className =
          "placeholder";
        placeholder.textContent = "🎤";
        card.appendChild(placeholder);
      }
      const body =
        document.createElement("div");
      body.className = "card-body";
      const title =
        document.createElement("div");
      title.className = "card-title";
      title.textContent =
        artist.name || "Artiste";
      body.appendChild(title);
      const meta =
        document.createElement("div");
      meta.className = "meta";
      const parts = [];
      if (artist.city) {
        parts.push(artist.city);
      }
      if (artist.region) {
        parts.push(artist.region);
      }
      if (artist.genre) {
        parts.push(artist.genre);
      }
      if (artist.language) {
        parts.push(artist.language);
      }
      meta.textContent =
        parts.join(" · ");
      body.appendChild(meta);
      if (artist.verified) {
        const verified =
          document.createElement("div");
        verified.className =
          "verified";
        verified.innerHTML =
          '<span class="verified-dot">✓</span>' +
          'Artiste vérifié';
        body.appendChild(verified);
      }
      const link =
        document.createElement("a");
      link.className = "button";
      link.innerHTML =
        "Voir le profil <span>→</span>";
      link.href =
        "public-artist.html?id=" +
        encodeURIComponent(artist.id);
      body.appendChild(link);
      card.appendChild(body);
      container.appendChild(card);
    });
  }
  async function loadAlbums() {
    const container =
      document.getElementById("albums");
    const { data, error } = await db
      .from("albums")
      .select(`
        id,
        title,
        slug,
        type,
        cover_url,
        release_date,
        description,
        artist_id,
        artists (
          id,
          name,
          status
        )
      `)
      .eq("status", "published")
      .order("created_at", {
        ascending: false
      });
    if (error) {
      console.error(error);
      container.innerHTML =
        '<div class="notice">Impossible de charger les albums.</div>';
      return;
    }
    const albums =
      (data || []).filter(album =>
        album.artists &&
        album.artists.status === "published"
      );
    if (albums.length === 0) {
      container.innerHTML =
        '<div class="notice">Aucun album publié pour le moment.</div>';
      return;
    }
    container.innerHTML = "";
    albums.forEach(album => {
      const card =
        document.createElement("div");
      card.className = "card";
      if (album.cover_url) {
        const img =
          document.createElement("img");
        img.className = "image";
        img.src = album.cover_url;
        img.alt = album.title;
        card.appendChild(img);
      } else {
        const placeholder =
          document.createElement("div");
        placeholder.className =
          "placeholder";
        placeholder.textContent = "💿";
        card.appendChild(placeholder);
      }
      const body =
        document.createElement("div");
      body.className = "card-body";
      const title =
        document.createElement("div");
      title.className = "card-title";
      title.textContent =
        album.title || "Album";
      body.appendChild(title);
      const meta =
        document.createElement("div");
      meta.className = "meta";
      const parts = [];
      if (album.artists?.name) {
        parts.push(album.artists.name);
      }
      if (album.type) {
        parts.push(album.type.toUpperCase());
      }
      if (album.release_date) {
        parts.push(
          new Date(album.release_date)
            .toLocaleDateString("fr-FR")
        );
      }
      meta.textContent =
        parts.join(" · ");
      body.appendChild(meta);
      const link =
        document.createElement("a");
      link.className = "button";
      link.innerHTML =
        "Voir l’album <span>→</span>";
      link.href =
        "public-album.html?id=" +
        encodeURIComponent(album.id);
      body.appendChild(link);
      card.appendChild(body);
      container.appendChild(card);
    });
  }
  loadArtists();
  loadAlbums();
</script>
</body>
</html>
