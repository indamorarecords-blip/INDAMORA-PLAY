<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes abonnements & dons — INDAMORA PLAY</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f9ff;
      color: #123;
    }
    header {
      background: #0757b8;
      color: white;
      padding: 18px 20px;
      text-align: center;
    }
    header h1 {
      margin: 0;
      font-size: 24px;
    }
    header p {
      margin: 6px 0 0;
      opacity: 0.9;
    }
    main {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 18px;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 8px 25px rgba(0, 70, 150, 0.08);
    }
    .account {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
    }
    .email {
      color: #0757b8;
      font-weight: bold;
      word-break: break-word;
    }
    button,
    a.button {
      display: inline-block;
      border: 0;
      border-radius: 10px;
      padding: 11px 16px;
      background: #0757b8;
      color: white;
      text-decoration: none;
      cursor: pointer;
      font-weight: bold;
    }
    button.secondary,
    a.secondary {
      background: #e8f1ff;
      color: #0757b8;
    }
    button.danger {
      background: #d93025;
    }
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 15px;
    }
    .payment {
      border: 1px solid #dbe8f8;
      border-radius: 14px;
      padding: 18px;
      margin-top: 14px;
      background: #fbfdff;
    }
    .payment h3 {
      margin: 0 0 8px;
      color: #0757b8;
    }
    .payment p {
      margin: 6px 0;
    }
    .status {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 999px;
      background: #e8f7ee;
      color: #147a3d;
      font-size: 13px;
      font-weight: bold;
    }
    .status.pending,
    .status.incomplete {
      background: #fff4d6;
      color: #9a6700;
    }
    .status.canceled,
    .status.past_due {
      background: #ffe8e6;
      color: #b42318;
    }
    .empty {
      text-align: center;
      padding: 30px 15px;
      color: #667;
    }
    .message {
      padding: 12px 15px;
      border-radius: 10px;
      margin-top: 15px;
      display: none;
    }
    .message.error {
      display: block;
      background: #ffe8e6;
      color: #b42318;
    }
    .message.success {
      display: block;
      background: #e8f7ee;
      color: #147a3d;
    }
    .loading {
      text-align: center;
      padding: 25px;
      color: #0757b8;
    }
    footer {
      text-align: center;
      padding: 30px 15px;
      color: #667;
      font-size: 14px;
    }
  </style>
</head>
<body>
<header>
  <h1>💙 INDAMORA PLAY</h1>
  <p>Mes abonnements & dons</p>
</header>
<main>
  <section class="card">
    <div class="account">
      <div>
        <div>Compte connecté</div>
        <div id="userEmail" class="email">Chargement...</div>
      </div>
      <button id="logoutBtn" class="danger">
        Se déconnecter
      </button>
    </div>
    <div class="actions">
      <a href="subscription-account.html" class="button">
        Abonnements & dons
      </a>
      <a href="index.html" class="button secondary">
        Retour à INDAMORA PLAY
      </a>
      <button id="refreshBtn" class="secondary">
        Actualiser
      </button>
    </div>
    <div id="message" class="message"></div>
  </section>
  <section class="card">
    <h2>💙 Mon soutien</h2>
    <div id="payments">
      <div class="loading">
        Chargement de vos paiements...
      </div>
    </div>
  </section>
</main>
<footer>
  INDAMORA PLAY — INDAMORA RECORDS 🇨🇫
</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL =
    "https://adqsdnqkbitplbhbihiv.supabase.co";
  const SUPABASE_KEY =
    "sb_publishable_dpjfWOYeNQRmP2nJq5FoMA_8NUuD0HF";
  const { createClient } = supabase;
  const db = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );
  const userEmail = document.getElementById("userEmail");
  const paymentsContainer = document.getElementById("payments");
  const message = document.getElementById("message");
  const logoutBtn = document.getElementById("logoutBtn");
  const refreshBtn = document.getElementById("refreshBtn");
  function showMessage(text, type = "error") {
    message.textContent = text;
    message.className = "message " + type;
  }
  function clearMessage() {
    message.textContent = "";
    message.className = "message";
  }
  function formatAmount(amount, currency) {
    if (amount === null || amount === undefined) {
      return "Montant non disponible";
    }
    const value = Number(amount) / 100;
    const code = (currency || "").toUpperCase();
    if (code === "XAF") {
      return new Intl.NumberFormat("fr-FR").format(value) + " FCFA";
    }
    if (code === "EUR") {
      return new Intl.NumberFormat("fr-FR", {
        style: "currency",
        currency: "EUR"
      }).format(value);
    }
    return (
      new Intl.NumberFormat("fr-FR", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }).format(value) +
      " " +
      code
    );
  }
  function formatDate(value) {
    if (!value) return "—";
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) {
      return "—";
    }
    return new Intl.DateTimeFormat("fr-FR", {
      dateStyle: "medium",
      timeStyle: "short"
    }).format(date);
  }
  function statusLabel(status) {
    const labels = {
      paid: "Payé",
      active: "Actif",
      trialing: "Essai",
      past_due: "Paiement en retard",
      canceled: "Annulé",
      incomplete: "Incomplet",
      incomplete_expired: "Expiré",
      unpaid: "Impayé",
      paused: "En pause",
      pending: "En attente"
    };
    return labels[status] || status || "Inconnu";
  }
  function statusClass(status) {
    if (
      status === "canceled" ||
      status === "past_due" ||
      status === "unpaid"
    ) {
      return "status " + status;
    }
    if (
      status === "pending" ||
      status === "incomplete" ||
      status === "incomplete_expired"
    ) {
      return "status pending";
    }
    return "status";
  }
  function paymentTitle(payment) {
    if (payment.kind === "subscription") {
      if (payment.plan_code === "africa") {
        return "🌍 Abonnement Afrique";
      }
      if (payment.plan_code === "outside_africa") {
        return "🌎 Abonnement hors Afrique";
      }
      return "🎧 Abonnement INDAMORA PLAY";
    }
    return "💙 Don à INDAMORA PLAY";
  }
  function paymentDescription(payment) {
    if (payment.kind === "subscription") {
      if (payment.plan_code === "africa") {
        return "Abonnement mensuel à 500 FCFA.";
      }
      if (payment.plan_code === "outside_africa") {
        return "Abonnement mensuel à 5 €.";
      }
      return "Abonnement mensuel INDAMORA PLAY.";
    }
    return "Merci pour votre soutien à INDAMORA PLAY et aux artistes publiés sur la plateforme.";
  }
  function renderPayments(rows) {
    if (!rows || rows.length === 0) {
      paymentsContainer.innerHTML = `
        <div class="empty">
          <div style="font-size:40px;">💙</div>
          <h3>Aucun paiement enregistré</h3>
          <p>
            Vos futurs abonnements et dons apparaîtront ici automatiquement.
          </p>
          <div class="actions" style="justify-content:center;">
            <a href="subscription-account.html" class="button">
              Soutenir INDAMORA PLAY
            </a>
          </div>
        </div>
      `;
      return;
    }
    paymentsContainer.innerHTML = rows.map(payment => `
      <article class="payment">
        <h3>
          ${paymentTitle(payment)}
        </h3>
        <p>
          ${paymentDescription(payment)}
        </p>
        <p>
          <strong>Montant :</strong>
          ${formatAmount(payment.amount_total, payment.currency)}
        </p>
        <p>
          <strong>Statut :</strong>
          <span class="${statusClass(payment.status)}">
            ${statusLabel(payment.status)}
          </span>
        </p>
        <p>
          <strong>Date :</strong>
          ${formatDate(payment.created_at)}
        </p>
        ${
          payment.current_period_start
            ? `
              <p>
                <strong>Début de période :</strong>
                ${formatDate(payment.current_period_start)}
              </p>
            `
            : ""
        }
        ${
          payment.current_period_end
            ? `
              <p>
                <strong>Fin de période :</strong>
                ${formatDate(payment.current_period_end)}
              </p>
            `
            : ""
        }
      </article>
    `).join("");
  }
  async function loadPayments() {
    clearMessage();
    paymentsContainer.innerHTML = `
      <div class="loading">
        Chargement de vos paiements...
      </div>
    `;
    const {
      data: { session },
      error: sessionError
    } = await db.auth.getSession();
    if (sessionError) {
      console.error(sessionError);
      showMessage(
        "Impossible de vérifier la session."
      );
      return;
    }
    if (!session || !session.user) {
      window.location.href = "account.html";
      return;
    }
    userEmail.textContent =
      session.user.email || "Compte connecté";
    const {
      data,
      error
    } = await db
      .from("support_payments")
      .select(`
        id,
        kind,
        plan_code,
        stripe_checkout_session_id,
        stripe_customer_id,
        stripe_subscription_id,
        amount_total,
        currency,
        status,
        current_period_start,
        current_period_end,
        created_at,
        updated_at
      `)
      .eq("user_id", session.user.id)
      .order("created_at", {
        ascending: false
      });
    if (error) {
      console.error(error);
      showMessage(
        "Impossible de charger vos paiements."
      );
      paymentsContainer.innerHTML = `
        <div class="empty">
          Une erreur est survenue pendant le chargement.
        </div>
      `;
      return;
    }
    renderPayments(data || []);
  }
  logoutBtn.addEventListener("click", async () => {
    await db.auth.signOut();
    window.location.href = "account.html";
  });
  refreshBtn.addEventListener("click", () => {
    loadPayments();
  });
  db.auth.onAuthStateChange((event, session) => {
    if (!session) {
      window.location.href = "account.html";
    }
  });
  loadPayments();
</script>
</body>
</html>
