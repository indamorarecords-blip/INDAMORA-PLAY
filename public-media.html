<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clips & Podcasts — INDAMORA PLAY</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --blue: #1689C7;
      --blue-dark: #0757B8;
      --blue-soft: #EAF6FC;
      --red: #D92525;
      --yellow: #F2C230;
      --green: #168447;
      --white: #FFFFFF;
      --cream: #FFFDF8;
      --text: #18324A;
      --muted: #6D7F8F;
      --border: #E1EDF3;
      --shadow: 0 12px 35px rgba(22, 137, 199, 0.10);
      --shadow-hover: 0 18px 45px rgba(22, 137, 199, 0.17);
      --radius: 22px;
    }
    * {
      box-sizing: border-box;
    }
    html {
      scroll-behavior: smooth;
    }
    body {
      margin: 0;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        Helvetica,
        sans-serif;
      background:
        linear-gradient(
          180deg,
          var(--cream) 0%,
          var(--white) 40%,
          var(--blue-soft) 100%
        );
      color: var(--text);
      min-height: 100vh;
    }
    /* =========================
       HEADER
    ========================= */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }
    .header-inner {
      max-width: 1180px;
      margin: auto;
      min-height: 76px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--blue-dark);
      font-size: 21px;
      font-weight: 900;
      letter-spacing: -0.4px;
    }
    .logo-mark {
      width: 39px;
      height: 39px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background:
        linear-gradient(
          135deg,
          var(--blue),
          var(--blue-dark)
        );
      color: white;
      box-shadow:
        0 8px 20px rgba(22, 137, 199, 0.20);
    }
    .back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--blue-dark);
      text-decoration: none;
      font-size: 14px;
      font-weight: 800;
      padding: 10px 14px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 12px;
      transition:
        transform 0.2s ease,
        background 0.2s ease,
        border-color 0.2s ease;
    }
    .back:hover {
      transform: translateY(-2px);
      background: var(--blue-soft);
      border-color: #B9DDEC;
    }
    /* =========================
       MAIN
    ========================= */
    main {
      max-width: 1180px;
      margin: auto;
      padding:
        48px 20px 35px;
    }
    .hero {
      position: relative;
      overflow: hidden;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 42px 38px;
      box-shadow: var(--shadow);
      margin-bottom: 34px;
    }
    .hero::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 5px;
      background:
        linear-gradient(
          90deg,
          var(--blue) 0%,
          var(--blue) 35%,
          var(--red) 35%,
          var(--red) 55%,
          var(--yellow) 55%,
          var(--yellow) 75%,
          var(--green) 75%,
          var(--green) 100%
        );
    }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 13px;
      border-radius: 999px;
      background: var(--blue-soft);
      border: 1px solid #CDE8F4;
      color: var(--blue-dark);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 17px;
    }
    h1 {
      margin: 0 0 13px;
      color: var(--text);
      font-size:
        clamp(30px, 5vw, 52px);
      line-height: 1.05;
      letter-spacing: -1.7px;
    }
    .hero-accent {
      color: var(--blue-dark);
    }
    .intro {
      max-width: 760px;
      margin: 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.7;
    }
    /* =========================
       FILTERS
    ========================= */
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 30px;
    }
    .filter {
      border: 1px solid var(--border);
      background: var(--white);
      color: var(--blue-dark);
      border-radius: 999px;
      padding:
        11px 17px;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
      box-shadow:
        0 5px 15px rgba(22, 137, 199, 0.06);
      transition:
        transform 0.2s ease,
        background 0.2s ease,
        color 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }
    .filter:hover {
      transform: translateY(-2px);
      border-color: #B9DDEC;
      background: var(--blue-soft);
      box-shadow:
        0 8px 20px rgba(22, 137, 199, 0.10);
    }
    .filter.active {
      background:
        linear-gradient(
          135deg,
          var(--blue),
          var(--blue-dark)
        );
      border-color: var(--blue-dark);
      color: white;
      box-shadow:
        0 8px 20px rgba(7, 87, 184, 0.18);
    }
    /* =========================
       MEDIA GRID
    ========================= */
    .grid {
      display: grid;
      grid-template-columns:
        repeat(
          auto-fill,
          minmax(285px, 1fr)
        );
      gap: 22px;
    }
    /* =========================
       CARDS
    ========================= */
    .card {
      position: relative;
      overflow: hidden;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        border-color 0.25s ease;
    }
    .card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-hover);
      border-color: #C7E2EE;
    }
    .card::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 3px;
      background:
        linear-gradient(
          90deg,
          var(--blue),
          var(--red),
          var(--yellow),
          var(--green)
        );
      opacity: 0;
      transition:
        opacity 0.25s ease;
    }
    .card:hover::after {
      opacity: 1;
    }
    /* =========================
       VISUAL
    ========================= */
    .visual {
      width: 100%;
      aspect-ratio: 16 / 9;
      background:
        linear-gradient(
          135deg,
          var(--blue-soft),
          #F9FDFF
        );
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .visual::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,0) 55%,
          rgba(7,87,184,0.08) 100%
        );
    }
    .visual img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition:
        transform 0.4s ease;
    }
    .card:hover .visual img {
      transform: scale(1.035);
    }
    .visual iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
    .visual-icon {
      font-size: 62px;
      filter:
        drop-shadow(
          0 8px 15px
          rgba(22, 137, 199, 0.12)
        );
    }
    /* =========================
       CARD BODY
    ========================= */
    .card-body
