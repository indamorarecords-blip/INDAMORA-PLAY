<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clips & Podcasts — INDAMORA PLAY</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --blue: #1689C7;
      --blue-dark: #0757B8;
      --blue-soft: #EAF6FC;
      --red: #D92525;
      --yellow: #F2C230;
      --green: #168447;
      --white: #FFFFFF;
      --cream: #FFFDF8;
      --text: #18324A;
      --muted: #6D7F8F;
      --border: #E1EDF3;
      --shadow: 0 12px 35px rgba(22, 137, 199, 0.10);
      --shadow-hover: 0 18px 45px rgba(22, 137, 199, 0.17);
      --radius: 22px;
    }
    * {
      box-sizing: border-box;
    }
    html {
      scroll-behavior: smooth;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        Helvetica,
        sans-serif;
      color: var(--text);
      background:
        linear-gradient(
          180deg,
          var(--cream) 0%,
          var(--white) 48%,
          var(--blue-soft) 100%
        );
    }
    /* =========================
       HEADER
    ========================= */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    .header-inner {
      max-width: 1180px;
      min-height: 76px;
      margin: auto;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--blue-dark);
      font-size: 21px;
      font-weight: 900;
      letter-spacing: -0.4px;
    }
    .logo-mark {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 13px;
      background: linear-gradient(
        135deg,
        var(--blue),
        var(--blue-dark)
      );
      color: var(--white);
      box-shadow:
        0 8px 20px rgba(22, 137, 199, 0.20);
    }
    .back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 15px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: var(--white);
      color: var(--blue-dark);
      text-decoration: none;
      font-size: 14px;
      font-weight: 900;
      transition:
        transform 0.2s ease,
        background 0.2s ease,
        border-color 0.2s ease;
    }
    .back:hover {
      transform: translateY(-2px);
      background: var(--blue-soft);
      border-color: #B9DDEC;
    }
    /* =========================
       MAIN
    ========================= */
    main {
      max-width: 1180px;
      margin: auto;
      padding: 48px 20px 40px;
    }
    .hero {
      position: relative;
      overflow: hidden;
      margin-bottom: 34px;
      padding: 42px 38px;
      border: 1px solid var(--border);
      border-radius: 30px;
      background: var(--white);
      box-shadow: var(--shadow);
    }
    .hero::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 5px;
      background: linear-gradient(
        90deg,
        var(--blue) 0%,
        var(--blue) 35%,
        var(--red) 35%,
        var(--red) 55%,
        var(--yellow) 55%,
        var(--yellow) 75%,
        var(--green) 75%,
        var(--green) 100%
      );
    }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 17px;
      padding: 8px 13px;
      border: 1px solid #CDE8F4;
      border-radius: 999px;
      background: var(--blue-soft);
      color: var(--blue-dark);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    h1 {
      margin: 0 0 13px;
      color: var(--text);
      font-size: clamp(30px, 5vw, 52px);
      line-height: 1.05;
      letter-spacing: -1.7px;
    }
    .hero-accent {
      color: var(--blue-dark);
    }
    .intro {
      max-width: 760px;
      margin: 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.7;
    }
    /* =========================
       FILTERS
    ========================= */
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 30px;
    }
    .filter {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 11px 17px;
      background: var(--white);
      color: var(--blue-dark);
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
      box-shadow:
        0 5px 15px rgba(22, 137, 199, 0.06);
      transition:
        transform 0.2s ease,
        background 0.2s ease,
        color 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }
    .filter:hover {
      transform: translateY(-2px);
      border-color: #B9DDEC;
      background: var(--blue-soft);
      box-shadow:
        0 8px 20px rgba(22, 137, 199, 0.10);
    }
    .filter.active {
      border-color: var(--blue-dark);
      background: linear-gradient(
        135deg,
        var(--blue),
        var(--blue-dark)
      );
      color: var(--white);
      box-shadow:
        0 8px 20px rgba(7, 87, 184, 0.18);
    }
    /* =========================
       MEDIA GRID
    ========================= */
    .grid {
      display: grid;
      grid-template-columns:
        repeat(
          auto-fill,
          minmax(285px, 1fr)
        );
      gap: 22px;
    }
    /* =========================
       CARDS
    ========================= */
    .card {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--white);
      box-shadow: var(--shadow);
      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        border-color 0.25s ease;
    }
    .card:hover {
      transform: translateY(-6px);
      border-color: #C7E2EE;
      box-shadow: var(--shadow-hover);
    }
    .card::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 3px;
      background: linear-gradient(
        90deg,
        var(--blue),
        var(--red),
        var(--yellow),
        var(--green)
      );
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    .card:hover::after {
      opacity: 1;
    }
    /* =========================
       VISUAL
    ========================= */
    .visual {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(
        135deg,
        var(--blue-soft),
        #F9FDFF
      );
    }
    .visual::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0) 55%,
        rgba(7, 87, 184, 0.08) 100%
      );
    }
    .visual img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }
    .card:hover .visual img {
      transform: scale(1.035);
    }
    .visual iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
    .visual-icon {
      font-size: 62px;
      filter:
        drop-shadow(
          0 8px 15px
          rgba(22, 137, 199, 0.12)
        );
    }
    /* =========================
       CARD BODY
    ========================= */
    .card-body {
      padding: 20px;
    }
    .type {
      display: inline-flex;
      align-items: center;
      margin-bottom: 11px;
      padding: 6px 10px;
      border: 1px solid #CDE8F4;
      border-radius: 999px;
      background: var(--blue-soft);
      color: var(--blue-dark);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.3px;
    }
    .title {
      margin-bottom: 8px;
      color: var(--text);
      font-size: 19px;
      font-weight: 900;
      line-height: 1.3;
    }
    .artist {
      margin-bottom: 10px;
      color: var(--blue-dark);
      font-size: 14px;
      font-weight: 800;
    }
    .description {
      margin-bottom: 16px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 10px 15px;
      border-radius: 12px;
      background: linear-gradient(
        135deg,
        var(--blue),
        var(--blue-dark)
      );
      color: var(--white);
      text-decoration: none;
      font-size: 13px;
      font-weight: 900;
      box-shadow:
        0 7px 18px rgba(7, 87, 184, 0.15);
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }
    .button:hover {
      transform: translateY(-2px);
      box-shadow:
        0 10px 24px rgba(7, 87, 184, 0.22);
    }
    /* =========================
       NOTICE
    ========================= */
    .notice {
      grid-column: 1 / -1;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--white);
      color: var(--muted);
      text-align: center;
      box-shadow: var(--shadow);
    }
    /* =========================
       FOOTER
    ========================= */
    footer {
      margin-top: 20px;
      padding: 42px 20px;
      border-top: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.80);
      color: var(--muted);
      text-align: center;
      line-height: 1.7;
    }
    footer strong {
      color: var(--blue-dark);
    }
    /* =========================
       MOBILE
    ========================= */
    @media (max-width: 700px) {
      .header-inner {
        min-height: 68px;
        padding: 12px 15px;
      }
      .logo {
        font-size: 17px;
      }
      .logo-mark {
        width: 35px;
        height: 35px;
        border-radius: 11px;
      }
      .back {
        padding: 9px 12px;
        font-size: 13px;
      }
      main {
        padding:
          28px 14px 30px;
      }
      .hero {
        padding: 31px 22px;
        border-radius: 24px;
      }
      h1 {
        font-size: 34px;
      }
      .intro {
        font-size: 15px;
      }
      .filters {
        gap: 8px;
      }
      .filter {
        padding: 10px 13px;
        font-size: 12px;
      }
      .grid {
        grid-template-columns: 1fr;
        gap: 18px;
      }
      .card-body {
        padding: 18px;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="logo">
      <span class="logo-mark">♪</span>
      <span>INDAMORA PLAY</span>
    </div>
<a class="back" href="index.html">
  ← Accueil
</a>
  </div>
</header>
<main>
  <section class="hero">
    <div class="hero-badge">
      🎬 INDAMORA PLAY
    </div>
<h1>
  Clips, Podcasts
  <span class="hero-accent">& Radios</span>
</h1>
<div class="intro">
  Retrouvez les contenus vidéo et audio publiés par les artistes
  sur INDAMORA PLAY.
</div>
  </section>
  <div class="filters">
<button class="filter active" data-type="all">
  Tous
</button>
<button class="filter" data-type="clip">
  🎬 Clips
</button>
<button class="filter" data-type="podcast">
  🎙️ Podcasts
</button>
<button class="filter" data-type="radio">
  📻 Radios
</button>
  </div>
  <div id="mediaGrid" class="grid">
<div class="notice">
  Chargement des contenus...
</div>
  </div>
</main>
<footer>
  <strong>INDAMORA PLAY</strong><br>
  INDAMORA RECORDS — Musique d’Afrique centrale 🇨🇫
</footer>
<script>
  const SUPABASE_URL =
    "https://adqsdnqkbitplbhbihiv.supabase.co";
  const SUPABASE_KEY =
    "sb_publishable_dpjfWOYeNQRmP2nJq5FoMA_8NUuD0HF";
  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );
  let allMedia = [];
  let currentType = "all";
  const mediaGrid =
    document.getElementById("mediaGrid");
  function typeLabel(type) {
    if (type === "clip") return "🎬 CLIP";
    if (type === "podcast") return "🎙️ PODCAST";
    if (type === "radio") return "📻 RADIO";
    return "🎬 MEDIA";
  }
  function iconForType(type) {
    if (type === "clip") return "🎬";
    if (type === "podcast") return "🎙️";
    if (type === "radio") return "📻";
    return "🎧";
  }
  function renderMedia() {
    const filtered =
      currentType === "all"
        ? allMedia
        : allMedia.filter(
            item => item.type === currentType
          );
    mediaGrid.innerHTML = "";
    if (filtered.length === 0) {
      const notice =
        document.createElement("div");
      notice.className = "notice";
      notice.textContent =
        currentType === "all"
          ? "Aucun contenu publié pour le moment."
          : "Aucun contenu de ce type n’est publié pour le moment.";
      mediaGrid.appendChild(notice);
      return;
    }
    filtered.forEach(item => {
      const card =
        document.createElement("article");
      card.className = "card";
      const visual =
        document.createElement("div");
      visual.className = "visual";
      if (item.media_url) {
        const lower =
          item.media_url.toLowerCase();
        const isImage =
          /\.(jpg|jpeg|png|webp|gif)$/i.test(lower);
        if (isImage) {
          const img =
            document.createElement("img");
          img.src = item.media_url;
          img.alt =
            item.title || "Media";
          visual.appendChild(img);
        } else {
          const iframe =
            document.createElement("iframe");
          iframe.src =
            item.media_url;
          iframe.width = "100%";
          iframe.height = "100%";
          iframe.style.border = "0";
          iframe.allow =
            "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
          iframe.allowFullscreen = true;
          visual.appendChild(iframe);
        }
      } else {
        const icon =
          document.createElement("div");
        icon.className =
          "visual-icon";
        icon.textContent =
          iconForType(item.type);
        visual.appendChild(icon);
      }
      card.appendChild(visual);
      const body =
        document.createElement("div");
      body.className =
        "card-body";
      const type =
        document.createElement("div");
      type.className =
        "type";
      type.textContent =
        typeLabel(item.type);
      body.appendChild(type);
      const title =
        document.createElement("div");
      title.className =
        "title";
      title.textContent =
        item.title || "Sans titre";
      body.appendChild(title);
      if (item.artists?.name) {
        const artist =
          document.createElement("div");
        artist.className =
          "artist";
        artist.textContent =
          "Par " + item.artists.name;
        body.appendChild(artist);
      }
      if (item.description) {
        const description =
          document.createElement("div");
        description.className =
          "description";
        description.textContent =
          item.description;
        body.appendChild(description);
      }
      if (item.media_url) {
        const link =
          document.createElement("a");
        link.className =
          "button";
        link.href =
          item.media_url;
        link.target =
          "_blank";
        link.rel =
          "noopener noreferrer";
        link.textContent =
          item.type === "clip"
            ? "▶ Voir le clip"
            : item.type === "podcast"
              ? "▶ Écouter"
              : "▶ Ouvrir la radio";
        body.appendChild(link);
      } else {
        const notice =
          document.createElement("div");
        notice.className =
          "description";
        notice.textContent =
          "Contenu en préparation.";
        body.appendChild(notice);
      }
      card.appendChild(body);
      mediaGrid.appendChild(card);
    });
  }
  async function loadMedia() {
    const { data, error } =
      await db
        .from("media")
        .select(`
          id,
          title,
          type,
          media_url,
          description,
          artist_id,
          artists (
            id,
            name,
            status
          )
        `)
        .eq("status", "published")
        .order("created_at", {
          ascending: false
        });
    if (error) {
      console.error(error);
      mediaGrid.innerHTML =
        '<div class="notice">Impossible de charger les contenus.</div>';
      return;
    }
    allMedia =
      (data || []).filter(item =>
        item.artists &&
        item.artists.status === "published"
      );
    renderMedia();
  }
  document
    .querySelectorAll(".filter")
    .forEach(button => {
      button.addEventListener("click", () => {
        document
          .querySelectorAll(".filter")
          .forEach(btn =>
            btn.classList.remove("active")
          );
        button.classList.add("active");
        currentType =
          button.dataset.type;
        renderMedia();
      });
    });
  loadMedia();
</script>
</body>
</html>
